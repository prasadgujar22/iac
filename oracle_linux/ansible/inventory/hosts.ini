# =============================================================================
# JMS HA POC - Ansible Inventory
# =============================================================================
# Matches Terraform-provisioned VMs in jms_ha_poc_terraform/main.tf
# -----------------------------------------------------------------------------

[rac_nodes]
rac-node1 ansible_host=192.168.29.120
rac-node2 ansible_host=192.168.29.121

[rac_nodes:vars]
oracle_node1_ip=192.168.29.120
oracle_node1_priv_ip=10.0.0.120
oracle_node1_hostname=rac-node1
oracle_node2_ip=192.168.29.121
oracle_node2_priv_ip=10.0.0.121
oracle_node2_hostname=rac-node2
# VIP addresses (must be registered in DNS or /etc/hosts for RAC)
oracle_node1_vip=192.168.29.130
oracle_node2_vip=192.168.29.131
# SCAN (Single Client Access Name) - use a free IP or round-robin DNS entry
oracle_scan_name=rac-scan
oracle_scan_ip=192.168.29.140

[wls_admin]
wls-admin ansible_host=192.168.29.122

[wls_managed]
wls-node1 ansible_host=192.168.29.123
wls-node2 ansible_host=192.168.29.124

[wls_nodes:children]
wls_admin
wls_managed

[all:vars]
ansible_user=prasad
ansible_ssh_private_key_file=/home/prasad/.ssh/id_ed25519
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
