---
# =============================================================================
# oracle_standalone_db/tasks/dbca.yml
# Create Oracle 19c standalone CDB (JMSDB) with one PDB (JMSPDB) via DBCA.
# Listener must be running before this task file executes.
# =============================================================================

- name: Generate DBCA response file
  template:
    src: dbca_response.j2
    dest: "{{ installer_stage }}/dbca.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'

# ─── Idempotency: skip DBCA if the database already appears in /etc/oratab ───
- name: Check if database already exists in oratab
  shell: grep -c "^{{ oracle_db_name }}:" /etc/oratab || true
  register: oratab_check
  changed_when: false
  failed_when: false

# runuser is used instead of become_user to bypass the broken sudo/sudoers_audit
# PAM path (see db_install.yml for the full explanation).
#
# PATH and LD_LIBRARY_PATH must be set explicitly: runuser non-login mode
# inherits the calling shell's PATH (no $ORACLE_HOME/bin), so DBCA cannot
# find oracle-internal binaries it spawns (orapwd, sqlplus, etc.).
#
# failed_when is strict: DBCA sometimes exits 0 even on failure (e.g. when
# prerequisites silently pass but creation never completes).  Require the
# success string in stdout so a silent rc=0 failure is caught and the real
# DBCA log output is shown to the operator.
- name: Create Oracle standalone database using DBCA (silent)
  shell: |
    runuser -u {{ oracle_user }} -- \
      {{ oracle_home }}/bin/dbca \
      -silent \
      -createDatabase \
      -responseFile {{ installer_stage }}/dbca.rsp
  args:
    executable: /bin/bash
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_BASE: "{{ oracle_base }}"
    PATH: "{{ oracle_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    LD_LIBRARY_PATH: "{{ oracle_home }}/lib:/lib:/usr/lib"
    HOME: "/home/{{ oracle_user }}"
  register: dbca_result
  failed_when: >
    dbca_result.rc not in [0] or
    ('Database creation complete' not in dbca_result.stdout and
     '100% complete' not in dbca_result.stdout)
  changed_when: >
    'Database creation complete' in dbca_result.stdout or
    '100% complete' in dbca_result.stdout
  when: oratab_check.stdout | int == 0

# Show output unconditionally (no when-guard) so that a silent DBCA failure
# is immediately visible in the play output without having to hunt log files.
- name: Show DBCA output
  debug:
    msg: |
      STDOUT:
      {{ dbca_result.stdout | default('(none)') }}
      STDERR:
      {{ dbca_result.stderr | default('(none)') }}
  when: dbca_result is defined

# ─── Archivelog mode (required for DataGuard / backup readiness) ─────────────
# Bounce is disruptive; skip the whole block if already in ARCHIVELOG mode.
- name: Check if archive log mode is already enabled
  shell: |
    printf '%s\n' \
      'SET PAGESIZE 0 FEEDBACK OFF HEADING OFF TRIMSPOOL ON' \
      'SELECT LOG_MODE FROM V$DATABASE;' \
      'EXIT;' | \
    ORACLE_HOME={{ oracle_home }} ORACLE_SID={{ oracle_db_name }} \
    runuser -u {{ oracle_user }} -- \
      {{ oracle_home }}/bin/sqlplus -S / as sysdba
  args:
    executable: /bin/bash
  register: archivelog_mode_check
  changed_when: false
  failed_when: false

- name: Enable archive log mode
  shell: |
    printf '%s\n' \
      'SHUTDOWN IMMEDIATE;' \
      'STARTUP MOUNT;' \
      'ALTER DATABASE ARCHIVELOG;' \
      'ALTER DATABASE OPEN;' \
      'ALTER PLUGGABLE DATABASE {{ oracle_pdb_name }} OPEN;' \
      'ALTER PLUGGABLE DATABASE {{ oracle_pdb_name }} SAVE STATE;' \
      'EXIT;' | \
    ORACLE_HOME={{ oracle_home }} ORACLE_SID={{ oracle_db_name }} \
    runuser -u {{ oracle_user }} -- \
      {{ oracle_home }}/bin/sqlplus -S / as sysdba
  args:
    executable: /bin/bash
  register: archivelog_result
  changed_when: "'Database altered' in archivelog_result.stdout"
  when: "'ARCHIVELOG' not in archivelog_mode_check.stdout"

# Force LREG to register DB services with the listener immediately rather than
# waiting up to 60 s for the background registration cycle.
- name: Register database services with listener
  shell: |
    printf '%s\n' \
      'ALTER SYSTEM REGISTER;' \
      'EXIT;' | \
    ORACLE_HOME={{ oracle_home }} ORACLE_SID={{ oracle_db_name }} \
    runuser -u {{ oracle_user }} -- \
      {{ oracle_home }}/bin/sqlplus -S / as sysdba
  args:
    executable: /bin/bash
  changed_when: false

# ─── Auto-start on reboot via systemd ────────────────────────────────────────
# oratab Y flag is required by dbstart / dbshut scripts.
# /etc/oratab is created by DBCA during database creation; it does NOT exist
# before the first successful DBCA run.  create: true prevents a fatal failure
# on re-runs where DBCA is skipped (DB already in oratab) but the file's Y
# flag needs updating (e.g. was manually set to N).
- name: Ensure oratab Y flag is set for JMSDB
  lineinfile:
    path: /etc/oratab
    regexp: '^{{ oracle_db_name }}:{{ oracle_home }}:'
    line: "{{ oracle_db_name }}:{{ oracle_home }}:Y"
    create: true
    owner: root
    group: root
    mode: '0644'

- name: Deploy Oracle DB systemd service
  copy:
    dest: /etc/systemd/system/oracle-db.service
    mode: '0644'
    content: |
      [Unit]
      Description=Oracle Database 19c – {{ oracle_db_name }}
      After=network.target oracle-listener.service
      Wants=oracle-listener.service

      [Service]
      Type=forking
      User={{ oracle_user }}
      Environment=ORACLE_HOME={{ oracle_home }}
      Environment=ORACLE_BASE={{ oracle_base }}
      Environment=ORACLE_SID={{ oracle_db_name }}
      ExecStart={{ oracle_home }}/bin/dbstart {{ oracle_home }}
      ExecStop={{ oracle_home }}/bin/dbshut {{ oracle_home }}
      RemainAfterExit=yes
      TimeoutStartSec=600
      TimeoutStopSec=300

      [Install]
      WantedBy=multi-user.target
  register: db_service_file

# Same pattern as oracle-listener: daemon-reload works, but both
# 'systemctl is-enabled' (D-Bus) and Ansible's file: state: link (controller
# pre-check on src) fail in this OL9 VM environment.  Use ln -sf instead.
- name: Reload systemd daemon to register oracle-db unit
  systemd:
    daemon_reload: true

- name: Enable oracle-db service at boot (WantedBy symlink)
  shell: >-
    ln -sf
    /etc/systemd/system/oracle-db.service
    /etc/systemd/system/multi-user.target.wants/oracle-db.service
  args:
    creates: /etc/systemd/system/multi-user.target.wants/oracle-db.service

# ─── Verification ─────────────────────────────────────────────────────────────
- name: Verify database is open
  shell: |
    printf '%s\n' \
      'SET PAGESIZE 20 FEEDBACK OFF HEADING ON TRIMSPOOL ON' \
      'SELECT status FROM v$instance;' \
      'SELECT open_mode FROM v$database;' \
      'SELECT name, open_mode FROM v$pdbs;' \
      'EXIT;' | \
    ORACLE_HOME={{ oracle_home }} ORACLE_SID={{ oracle_db_name }} \
    runuser -u {{ oracle_user }} -- \
      {{ oracle_home }}/bin/sqlplus -S / as sysdba
  args:
    executable: /bin/bash
  register: db_status
  changed_when: false

- name: Show database status
  debug:
    var: db_status.stdout_lines
