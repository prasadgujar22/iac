---
# =============================================================================
# oracle_standalone_db/tasks/listener.yml
# Configure and start Oracle Net listener
# Must run before DBCA so the DB can register its services on creation.
# =============================================================================

- name: Create Oracle Net admin directory
  file:
    path: "{{ oracle_home }}/network/admin"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'

- name: Generate listener.ora
  template:
    src: listener.ora.j2
    dest: "{{ oracle_home }}/network/admin/listener.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'
  notify: restart listener

# runuser is used instead of become_user to bypass the broken sudo/sudoers_audit
# PAM path (see db_install.yml for the full explanation).
- name: Check if listener is already running
  shell: |
    ORACLE_HOME={{ oracle_home }} \
    runuser -u {{ oracle_user }} -- \
      {{ oracle_home }}/bin/lsnrctl status {{ listener_name }}
  args:
    executable: /bin/bash
  register: lsnrctl_status
  changed_when: false
  failed_when: false

- name: Start Oracle Net listener
  shell: |
    ORACLE_HOME={{ oracle_home }} \
    runuser -u {{ oracle_user }} -- \
      {{ oracle_home }}/bin/lsnrctl start {{ listener_name }}
  args:
    executable: /bin/bash
  register: lsnrctl_start
  changed_when: lsnrctl_start.rc == 0
  failed_when: >
    lsnrctl_start.rc != 0 and
    'already running' not in lsnrctl_start.stdout
  when: lsnrctl_status.rc != 0

# Systemd unit enables the listener to survive a reboot.
- name: Deploy Oracle listener systemd service
  copy:
    dest: /etc/systemd/system/oracle-listener.service
    mode: '0644'
    content: |
      [Unit]
      Description=Oracle Net Listener – {{ listener_name }}
      After=network.target

      [Service]
      Type=forking
      User={{ oracle_user }}
      Environment=ORACLE_HOME={{ oracle_home }}
      Environment=ORACLE_BASE={{ oracle_base }}
      ExecStart={{ oracle_home }}/bin/lsnrctl start {{ listener_name }}
      ExecStop={{ oracle_home }}/bin/lsnrctl stop {{ listener_name }}
      ExecReload={{ oracle_home }}/bin/lsnrctl reload {{ listener_name }}
      RemainAfterExit=yes
      TimeoutStartSec=120

      [Install]
      WantedBy=multi-user.target
  register: listener_service_file

# Two-step enable that avoids Ansible's systemd module 'enabled: true' path.
# That path calls 'systemctl is-enabled', which requires a D-Bus connection
# that this OL9 VM does not provide reliably (returns ": host" error).
# Ansible's file module with state: link also fails because it pre-validates
# src existence on the controller side before sending the task to the remote.
# Use 'ln -sf' via shell instead: no pre-checks, no D-Bus, fully idempotent
# via 'creates:' (skip if the symlink already exists).
- name: Reload systemd daemon to register oracle-listener unit
  systemd:
    daemon_reload: true

- name: Enable oracle-listener service at boot (WantedBy symlink)
  shell: >-
    ln -sf
    /etc/systemd/system/oracle-listener.service
    /etc/systemd/system/multi-user.target.wants/oracle-listener.service
  args:
    creates: /etc/systemd/system/multi-user.target.wants/oracle-listener.service
