---
# =============================================================================
# oracle_standalone_db/tasks/pre_install.yml
# Oracle 19c single-instance OS pre-requisites
# (no Grid Infrastructure, no ASM, no inter-node SSH key exchange)
# =============================================================================

# Nodes are Oracle Linux 9.  The signing key ships with the OS at the path
# below; using it avoids an outbound HTTPS fetch for the key on every dnf run.
- name: Configure Oracle Linux 9 BaseOS repository
  yum_repository:
    name: ol9_baseos_latest
    description: "Oracle Linux 9 BaseOS Latest (x86_64)"
    baseurl: "https://yum.oracle.com/repo/OracleLinux/OL9/baseos/latest/x86_64/"
    gpgcheck: yes
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle"
    enabled: yes

- name: Configure Oracle Linux 9 UEK R7 repository
  yum_repository:
    name: ol9_UEKR7
    description: "Oracle Linux 9 UEK R7 (x86_64)"
    baseurl: "https://yum.oracle.com/repo/OracleLinux/OL9/UEKR7/x86_64/"
    gpgcheck: yes
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle"
    enabled: yes

# AppStream provides compat-openssl11 which Oracle 19.3 needs at link time.
# Oracle 19.3 was compiled against OpenSSL 1.1.x; OL9 ships only OpenSSL 3.0.
- name: Configure Oracle Linux 9 AppStream repository
  yum_repository:
    name: ol9_appstream
    description: "Oracle Linux 9 AppStream (x86_64)"
    baseurl: "https://yum.oracle.com/repo/OracleLinux/OL9/appstream/x86_64/"
    gpgcheck: yes
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle"
    enabled: yes

- name: Install Oracle 19c prerequisite packages
  dnf:
    name:
      - oracle-database-preinstall-19c
    state: present

# OL9 compatibility packages for Oracle 19.3 (base release, pre-RU):
#   libnsl2          – replaces libnsl which was removed from glibc in OL9;
#                      symlinks below expose it as libnsl.so.1 / libnsl.so
#   compat-openssl11 – provides libssl.so.1.1 / libcrypto.so.1.1; Oracle 19.3
#                      was compiled against OpenSSL 1.1.x and the ins_rdbms.mk
#                      relink step fails with "cannot find -lssl" on OL9's 3.0
#   (libnsl2-devel does not exist on OL9; the libnsl.so symlink task below
#    provides the unversioned linker stub that -lnsl needs at build time)
- name: Install Oracle 19c / OL9 compatibility packages
  dnf:
    name:
      - libnsl2
      - compat-openssl11
    state: present

# On OL9 (glibc 2.34+) libpthread was merged into libc; both
# libpthread_nonshared.a and libc_nonshared.a no longer ship at all.
# Oracle 19c's ins_rdbms.mk references them at link time; creating empty stub
# archives satisfies the linker — no real symbols are needed from these files.
- name: Create libpthread_nonshared.a / libc_nonshared.a stubs (OL9 / glibc-2.34+)
  shell: |
    changed=0
    for stub in /usr/lib64/libc_nonshared.a /usr/lib64/libpthread_nonshared.a; do
      [ -e "$stub" ] && continue
      ar crs "$stub"
      changed=1
    done
    [ "$changed" -eq 1 ] && echo changed || echo ok
  args:
    executable: /bin/bash
  register: stub_result
  changed_when: "'changed' in stub_result.stdout"

- name: Create libnsl.so linker stub for Oracle 19c on OL9
  shell: |
    libnsl_lib=""
    for candidate in /usr/lib64/libnsl.so.2 /usr/lib64/libnsl.so.1; do
      [ -e "$candidate" ] && libnsl_lib="$candidate" && break
    done
    [ -z "$libnsl_lib" ] && echo "No libnsl library found" >&2 && exit 1

    changed=0
    if [ ! -e /usr/lib64/libnsl.so.1 ]; then
      ln -s "$libnsl_lib" /usr/lib64/libnsl.so.1 && changed=1
    fi
    if [ ! -L /usr/lib64/libnsl.so ] || \
       [ "$(readlink /usr/lib64/libnsl.so)" != "$libnsl_lib" ]; then
      ln -sf "$libnsl_lib" /usr/lib64/libnsl.so && changed=1
    fi
    [ "$changed" -eq 1 ] && echo changed || echo ok
  args:
    executable: /bin/bash
  register: libnsl_symlinks
  changed_when: "'changed' in libnsl_symlinks.stdout"

# Write the oracle user bash_profile directly here rather than relying on the
# common role, which guards the task with `when: oracle_home is defined` and
# may skip it if oracle_home is not resolved during common-role execution.
# ORACLE_SID has no instance-number suffix (standalone, not RAC).
- name: Write oracle user bash_profile for standalone DB
  copy:
    dest: /home/{{ oracle_user }}/.bash_profile
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
    content: |
      # Oracle env
      export ORACLE_BASE={{ oracle_base }}
      export ORACLE_HOME={{ oracle_home }}
      export ORACLE_SID={{ oracle_db_name }}
      export NLS_DATE_FORMAT="DD-MON-YYYY HH24:MI:SS"
      export PATH=$ORACLE_HOME/bin:$PATH:$HOME/.local/bin:$HOME/bin
      export LD_LIBRARY_PATH=$ORACLE_HOME/lib:/lib:/usr/lib
      export CLASSPATH=$ORACLE_HOME/jlib:$ORACLE_HOME/rdbms/jlib

# --- Oracle home and data directories ---
- name: Create Oracle DB home directory
  file:
    path: "{{ oracle_home }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'

- name: Create datafile destination directory
  file:
    path: "{{ oracle_data_dir }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'

- name: Create Fast Recovery Area directory
  file:
    path: "{{ oracle_fra_dir }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'

# For single-instance install, oracle user runs runInstaller (not grid user).
# Re-own inventory directory so oracle user can write to it.
- name: Re-own Oracle Inventory directory to oracle for standalone install
  file:
    path: "{{ oracle_inventory }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'

# oraInst.loc tells Oracle installers where the central inventory lives.
- name: Write /etc/oraInst.loc
  copy:
    dest: /etc/oraInst.loc
    content: |
      inventory_loc={{ oracle_inventory }}
      inst_group={{ oracle_group }}
    mode: '0644'

# --- Installer media: verify on control node, copy + extract to DB node ---
- name: Verify Oracle DB zip exists on control node
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false   # play-level become:true leaks into delegate_to:localhost
  stat:
    path: "{{ local_installer_src }}/{{ oracle_db_zip }}"
  register: db_zip_stat

- name: Fail if Oracle DB zip is missing
  fail:
    msg: >
      Oracle DB installer not found at {{ local_installer_src }}/{{ oracle_db_zip }}
      on the Ansible control node. Place the file there or override the path with
      -e local_installer_src=/path/to/media
  when: not db_zip_stat.stat.exists

- name: Check if DB home is already extracted
  stat:
    path: "{{ oracle_home }}/runInstaller"
  register: db_home_stat

- name: Copy Oracle DB installer zip to staging area
  copy:
    src: "{{ local_installer_src }}/{{ oracle_db_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_db_zip }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  when: not db_home_stat.stat.exists

- name: Ensure Oracle DB home directory exists before extraction
  file:
    path: "{{ oracle_home }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'
  when: not db_home_stat.stat.exists

- name: Unzip Oracle DB installer to DB home
  shell: >-
    unzip -oq "{{ installer_stage }}/{{ oracle_db_zip }}"
    -d "{{ oracle_home }}"
  args:
    creates: "{{ oracle_home }}/runInstaller"
  when: not db_home_stat.stat.exists

- name: Set Oracle home ownership after extraction
  file:
    path: "{{ oracle_home }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    recurse: true
  when: not db_home_stat.stat.exists

- name: Remove DB installer zip from staging after extraction
  file:
    path: "{{ installer_stage }}/{{ oracle_db_zip }}"
    state: absent
  when: not db_home_stat.stat.exists

# Oracle 19.3's ins_rdbms.mk builds binaries (e.g. orion) using only sysliblist
# for system library resolution.  sysliblist ships without -lc, so static
# archives that reference libc symbols — specifically stat() in libnnzst19.a
# (Oracle Crypto Toolkit) — produce "undefined reference to stat" on OL9.
# orald (Oracle's linker wrapper) does not pull in libc implicitly the way
# gcc/cc does, leaving stat unresolved.
#
# Fix: append -lc to sysliblist.  Every Oracle Makefile target uses
# "$(shell cat sysliblist)" in its link command, so this resolves stat (and
# any other plain-libc symbols) for all Oracle binaries in one edit.
- name: Add -lc to Oracle sysliblist (fixes undefined reference to stat on OL9)
  shell: |
    sysliblist="{{ oracle_home }}/lib/sysliblist"
    if [ ! -f "$sysliblist" ]; then
      echo "ok (file not present)"
      exit 0
    fi
    if grep -qw -- '-lc' "$sysliblist"; then
      echo "ok"
      exit 0
    fi
    echo " -lc" >> "$sysliblist"
    echo "changed"
  args:
    executable: /bin/bash
  register: _sysliblist_result
  changed_when: "'changed' in _sysliblist_result.stdout"

# belt-and-suspenders fix: even with -lc in sysliblist, Oracle's orald wrapper
# does not resolve stat() from libc.so.6 for executable targets on OL9.
# Root cause: libnnzst19.a (Oracle Crypto Toolkit, third-party static archive)
# calls stat() directly; Oracle's orald does not implicitly link libc the way
# gcc does, so the reference is never satisfied from an external library.
#
# Solution: compile a stat() implementation using a direct kernel syscall and
# inject the resulting object into libnnzst19.a.  GNU ld's archive symbol-index
# will find stat_compat.o from within the same archive after ccme_ck_rand_-
# load_fileS1.o creates the undefined reference — no external resolution needed.
#
# The C source is written via the copy module (not a shell heredoc) because
# YAML block scalars require content to be indented, but shell heredoc bodies
# must start at column 1 — the two requirements are mutually exclusive.
- name: Write stat_compat.c for Oracle libnnzst19.a injection
  copy:
    dest: /tmp/_oracle_stat_compat.c
    mode: '0644'
    content: |
      #define _GNU_SOURCE
      #include <sys/types.h>
      #include <sys/stat.h>
      #include <unistd.h>
      #include <sys/syscall.h>
      #include <fcntl.h>
      /* stat() via direct kernel syscall (SYS_newfstatat / AT_FDCWD).
       * Satisfies the undefined reference to stat in Oracle 19.3 libnnzst19.a
       * on OL9/RHEL9 where orald does not implicitly pull in libc. */
      int stat(const char *restrict path, struct stat *restrict buf) {
          return (int)syscall(SYS_newfstatat, AT_FDCWD, path, buf, 0);
      }

- name: Inject stat() syscall wrapper into libnnzst19.a (OL9 orald fix)
  shell: |
    set -e
    archive="{{ oracle_home }}/lib/libnnzst19.a"
    if [ ! -f "$archive" ]; then
      echo "ok (archive absent)"
      exit 0
    fi
    if ar t "$archive" | grep -q '^stat_compat\.o$'; then
      echo "ok"
      exit 0
    fi
    gcc -O0 -fPIC -c -o /tmp/_oracle_stat_compat.o /tmp/_oracle_stat_compat.c
    ar rcs "$archive" /tmp/_oracle_stat_compat.o
    rm -f /tmp/_oracle_stat_compat.o /tmp/_oracle_stat_compat.c
    echo "changed"
  args:
    executable: /bin/bash
  register: _stat_inject_result
  changed_when: "'changed' in _stat_inject_result.stdout"
