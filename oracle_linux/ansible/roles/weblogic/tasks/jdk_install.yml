---
# =============================================================================
# weblogic/tasks/jdk_install.yml
# Install Oracle JDK 17 (required for WebLogic 14.1.2)
# =============================================================================

- name: Create oracle user (WLS nodes)
  user:
    name: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    groups: "{{ oracle_groups | join(',') }}"
    shell: /bin/bash
    home: /home/{{ oracle_user }}
    create_home: true

- name: Create directory tree for WLS (except jdk_home – created as symlink later)
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'
  loop:
    - "{{ oracle_base }}"
    - "{{ mw_home }}"
    - "{{ installer_stage }}"

- name: Verify JDK RPM exists on control node
  delegate_to: localhost
  become: false
  stat:
    path: "{{ local_installer_src }}/{{ jdk_rpm }}"
  register: jdk_rpm_stat

- name: Fail if JDK RPM is missing
  fail:
    msg: >
      JDK RPM not found at {{ local_installer_src }}/{{ jdk_rpm }}
      on the Ansible control node. Place the file there or override
      local_installer_src with -e local_installer_src=/path/to/media
  when: not jdk_rpm_stat.stat.exists

- name: Copy JDK 17 RPM to staging area on remote
  copy:
    src: "{{ local_installer_src }}/{{ jdk_rpm }}"
    dest: "{{ installer_stage }}/{{ jdk_rpm }}"
    owner: root
    group: root
    mode: '0644'

- name: Install JDK 17 RPM
  dnf:
    name: "{{ installer_stage }}/{{ jdk_rpm }}"
    state: present
    disable_gpg_check: true

- name: Detect actual JDK 17 home from RPM install (resolves symlink chain)
  shell: |
    java_bin=$(alternatives --list 2>/dev/null | awk '/^java /{print $3}' | head -1)
    if [ -z "$java_bin" ]; then
      java_bin=$(readlink -f /usr/bin/java 2>/dev/null)
    fi
    # Strip /bin/java suffix to get JAVA_HOME
    echo "${java_bin%/bin/java}"
  register: java_home_detect
  changed_when: false

- name: Set JAVA_HOME fact from detected path
  set_fact:
    java_home: "{{ java_home_detect.stdout | trim }}"

- name: Fail if JDK home was not detected
  fail:
    msg: "Could not detect JDK 17 home. Check that {{ jdk_rpm }} installed correctly."
  when: java_home == ''

- name: Show detected JAVA_HOME
  debug:
    msg: "Detected JAVA_HOME: {{ java_home }}"

- name: Remove existing jdk_home directory if it exists (to create symlink)
  file:
    path: "{{ jdk_home }}"
    state: absent
  when: java_home != jdk_home

- name: Create symlink {{ jdk_home }} → {{ java_home }}
  file:
    src: "{{ java_home }}"
    dest: "{{ jdk_home }}"
    state: link
    force: true
  when: java_home != jdk_home

- name: Set oracle user bash profile with JDK
  copy:
    dest: /home/{{ oracle_user }}/.bash_profile
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
    content: |
      export JAVA_HOME={{ jdk_home }}
      export MW_HOME={{ mw_home }}
      export WLS_HOME={{ wls_home }}
      export PATH=$JAVA_HOME/bin:$MW_HOME/oracle_common/common/bin:$PATH:$HOME/.local/bin:$HOME/bin

- name: Verify Java version
  command: "{{ jdk_home }}/bin/java -version"
  register: java_ver
  changed_when: false

- name: Show Java version
  debug:
    msg: "{{ java_ver.stderr | default(java_ver.stdout) }}"
