---
# =============================================================================
# weblogic/tasks/main.yml – orchestrates WLS 14.1.2 install
# =============================================================================

- name: Install JDK 17
  import_tasks: jdk_install.yml

- name: Install WebLogic 14.1.2
  import_tasks: wls_install.yml

- name: Create and configure WLS domain (Admin server only)
  import_tasks: domain_create.yml
  when: inventory_hostname in groups['wls_admin']

# managed_servers runs BEFORE node_manager because unpack.sh (called inside
# managed_servers.yml) requires an empty domain_home directory.
# node_manager.yml pre-creates domain_home/nodemanager/ and domain_home/logs/,
# which would cause unpack.sh error 60303.  Managed servers connect directly
# to the admin server via t3:// and do not need Node Manager to start.
- name: Configure and start Managed Servers
  import_tasks: managed_servers.yml
  when: inventory_hostname in groups['wls_managed']

- name: Configure Node Manager on all WLS nodes
  import_tasks: node_manager.yml
