---
# =============================================================================
# weblogic/tasks/node_manager.yml
# Configure and start Node Manager on every WLS node
# =============================================================================

- name: Create Node Manager home directory
  file:
    path: "{{ domain_home }}/nodemanager"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0750'

# domain_logs lives under domain_home which is only fully created on the admin
# node by domain_create.yml.  Managed nodes need the directory too so that
# the systemd unit can open the log files on startup.
- name: Create Node Manager log directory
  file:
    path: "{{ domain_logs }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0750'

# nodemanager.domains is required when DomainsFileEnabled=true (our default).
# NM crashes on startup if the file is referenced but absent.  An empty file
# is valid; nmEnroll() / domain pack-unpack will populate it later.
- name: Create empty nodemanager.domains if absent
  copy:
    content: ""
    dest: "{{ domain_home }}/nodemanager/nodemanager.domains"
    force: false        # never overwrite an already-populated file
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'

- name: Generate nodemanager.properties
  template:
    src: nodemanager.properties.j2
    dest: "{{ domain_home }}/nodemanager/nodemanager.properties"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'

- name: Install Node Manager systemd unit
  template:
    src: wls-nodemanager.service.j2
    dest: /etc/systemd/system/wls-nodemanager.service
    mode: '0644'
  notify: Reload systemd

- name: Reload systemd daemon before starting Node Manager
  systemd:
    daemon_reload: true

- block:
    - name: Enable and start Node Manager
      service:
        name: wls-nodemanager
        state: started
        enabled: true

    - name: Wait for Node Manager port 5556
      wait_for:
        host: "{{ ansible_host }}"
        port: 5556
        timeout: 90
        state: started

  rescue:
    # Dump enough context so the next run failure is immediately diagnosable.
    - name: Collect Node Manager journal (last 80 lines)
      command: journalctl -u wls-nodemanager -n 80 --no-pager
      register: _nm_journal
      changed_when: false

    - name: Show Node Manager journal
      debug:
        var: _nm_journal.stdout_lines

    - name: Collect Node Manager log file (last 50 lines)
      command: "tail -50 {{ domain_logs }}/nodemanager.log"
      register: _nm_log
      changed_when: false
      ignore_errors: true

    - name: Show Node Manager log
      debug:
        var: _nm_log.stdout_lines

    - name: Collect Node Manager error log (last 30 lines)
      command: "tail -30 {{ domain_logs }}/nodemanager.err"
      register: _nm_err
      changed_when: false
      ignore_errors: true

    - name: Show Node Manager error log
      debug:
        var: _nm_err.stdout_lines

    - name: Re-raise failure
      fail:
        msg: >-
          Node Manager failed to start on {{ inventory_hostname }}.
          Review the diagnostic output above to identify the root cause.
