---
# =============================================================================
# weblogic/tasks/managed_servers.yml
# Distribute the WLS domain to managed nodes and start managed servers.
# Prerequisites (run in prior phases of weblogic.yml):
#   - JDK + WLS installed on this host
#   - Node Manager running on this host
#   - Admin Server running (domain_create.yml has completed on wls-admin)
#   - managed_template.jar fetched to /tmp/ on the Ansible controller
# =============================================================================

# 1. Resolve which WLS managed-server name belongs to this inventory host.
#    managed_servers list example:
#      - { name: ms1, host: 192.168.29.123 }   # wls-node1
#      - { name: ms2, host: 192.168.29.124 }   # wls-node2
- name: Set managed server name for this host
  set_fact:
    ms_name: "{{ (managed_servers | selectattr('host', 'equalto', ansible_host) | first).name }}"

# 2. Push the packed domain template that domain_create.yml produced on the
#    admin server and the controller fetched to /tmp/managed_template.jar.
- name: Copy managed domain template to managed node
  copy:
    src: /tmp/managed_template.jar
    dest: "{{ installer_stage }}/managed_template.jar"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'

# 3. Unpack the domain.
#
#    unpack.sh requires an *empty* target directory (error 60303 otherwise).
#    Prior failed runs may have left partial content (e.g. nodemanager/ or
#    logs/ created by node_manager.yml before the phase order was fixed).
#
#    Guard logic:
#      a) If config/config.xml already exists → domain was fully unpacked on a
#         previous run; skip both the cleanup and the unpack (idempotent).
#      b) If domain_home exists but has NO config.xml → partial/stale state;
#         wipe the directory so unpack.sh starts from a clean slate.
#      c) If domain_home does not exist → nothing to clean; unpack proceeds.
#
- name: Check whether the domain has already been unpacked
  stat:
    path: "{{ domain_home }}/config/config.xml"
  register: _domain_config

- name: Remove partial domain directory so unpack.sh starts clean
  file:
    path: "{{ domain_home }}"
    state: absent
  when: not _domain_config.stat.exists

- name: Unpack managed domain template
  become_user: "{{ oracle_user }}"
  command: >
    {{ mw_home }}/oracle_common/common/bin/unpack.sh
    -domain={{ domain_home }}
    -template={{ installer_stage }}/managed_template.jar
  args:
    creates: "{{ domain_home }}/config/config.xml"
  environment:
    JAVA_HOME: "{{ jdk_home }}"
    MW_HOME: "{{ mw_home }}"

# 4. Ensure the logs directory exists before we start the systemd unit.
#    The wls-managed.service unit uses:
#      StandardOutput=append:{{ domain_logs }}/{{ inventory_hostname }}.log
#      StandardError=append:{{ domain_logs }}/{{ inventory_hostname }}.err
#    systemd's append: opens/creates the FILE but not missing parent directories.
#    If domain_logs does not exist the service fails to start silently.
#    unpack.sh does not create it, so we must ensure it here.
- name: Create domain logs directory
  file:
    path: "{{ domain_logs }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0750'

# 5. Pre-create boot.properties so the managed-server JVM can start
#    non-interactively.  WLS encrypts the plain-text credentials in-place on
#    the first successful boot; force: false prevents Ansible from overwriting
#    the encrypted file on subsequent runs.
- name: Create security directory for managed server
  file:
    path: "{{ domain_home }}/servers/{{ ms_name }}/security"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0700'

- name: Write boot.properties for managed server
  copy:
    content: |
      username={{ wls_admin_user }}
      password={{ wls_admin_password }}
    dest: "{{ domain_home }}/servers/{{ ms_name }}/security/boot.properties"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0600'
    force: false

# 5. Deploy the thin Ansible-managed wrapper.  It is intentionally named
#    startManagedServer.sh (not startManagedWebLogic.sh) so that it does NOT
#    overwrite the WLS-native script that unpack.sh created above.
#    The wrapper sets env vars and calls the native script with the correct
#    server name ({{ ms_name }}) and admin URL.
- name: Create managed server start script
  template:
    src: startManagedWebLogic.sh.j2
    dest: "{{ domain_home }}/bin/startManagedServer.sh"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0750'

- name: Install Managed Server systemd unit
  template:
    src: wls-managed.service.j2
    dest: "/etc/systemd/system/wls-managed-{{ inventory_hostname }}.service"
    mode: '0644'
  notify: Reload systemd

- name: Enable and start Managed Server service
  service:
    name: "wls-managed-{{ inventory_hostname }}"
    state: started
    enabled: true

- block:
    # Allow 5 minutes for the JVM to boot, load the domain config from
    # the admin server, and begin accepting connections.  First-boot on a
    # VM is typically 2-4 minutes; the extra headroom avoids false failures.
    - name: Wait for Managed Server port {{ managed_server_port }}
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ managed_server_port }}"
        timeout: 300
        state: started

  rescue:
    - name: Collect Managed Server journal (last 100 lines)
      command: "journalctl -u wls-managed-{{ inventory_hostname }} -n 100 --no-pager"
      register: _ms_journal
      changed_when: false

    - name: Show Managed Server journal
      debug:
        var: _ms_journal.stdout_lines

    - name: Collect Managed Server stdout log (last 80 lines)
      command: "tail -80 {{ domain_logs }}/{{ inventory_hostname }}.log"
      register: _ms_log
      changed_when: false
      ignore_errors: true

    - name: Show Managed Server stdout log
      debug:
        var: _ms_log.stdout_lines

    - name: Collect Managed Server stderr log (last 40 lines)
      command: "tail -40 {{ domain_logs }}/{{ inventory_hostname }}.err"
      register: _ms_err
      changed_when: false
      ignore_errors: true

    - name: Show Managed Server stderr log
      debug:
        var: _ms_err.stdout_lines

    - name: Re-raise failure
      fail:
        msg: >-
          Managed Server on {{ inventory_hostname }} did not open port
          {{ managed_server_port }} within 300 seconds.
          Review the diagnostic output above.
