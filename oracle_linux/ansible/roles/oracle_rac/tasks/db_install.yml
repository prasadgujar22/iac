---
# =============================================================================
# oracle_rac/tasks/db_install.yml
# Oracle Database 19c software-only install (RDBMS home, no database yet)
# The installer SSH-pushes the home to node2 automatically.
# =============================================================================

- name: Generate DB installer response file
  template:
    src: db_install_response.j2
    dest: "{{ installer_stage }}/db_install.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'
  when: inventory_hostname == oracle_node1_hostname

- name: Run Oracle DB installer (silent, software only) – node1 only
  become_user: "{{ oracle_user }}"
  command: >
    {{ oracle_home }}/runInstaller
    -silent
    -responseFile {{ installer_stage }}/db_install.rsp
    -ignorePrereqFailure
    -skipPrereqs
  environment:
    CV_ASSUME_DISTID: OEL7.6
  register: db_install_result
  failed_when: >
    db_install_result.rc not in [0, 6] and
    'Successfully Setup Software' not in db_install_result.stdout
  changed_when: >
    'Successfully Setup Software' in db_install_result.stdout
  when: inventory_hostname == oracle_node1_hostname
  async: 3600
  poll: 30

- name: Show DB installer output
  debug:
    var: db_install_result.stdout_lines
  when: inventory_hostname == oracle_node1_hostname

# =============================================================================
# Verify the DB home was cloned to every cluster node.
#
# The installer SSH-clones the home from node1 to all other nodes listed in
# oracle.install.db.CLUSTER_NODES.  This cloning is skipped when the
# installer detects the home already exists on node1 (re-runs / rc=6 path),
# leaving non-primary nodes without a DB home if a prior run was interrupted
# before cloning completed.
#
# Fallback: copy the DB zip from the control node and extract it locally –
# identical to what pre_install.yml does for node1.
# =============================================================================
- name: Check if DB home root.sh exists on this node
  stat:
    path: "{{ oracle_home }}/root.sh"
  register: db_home_rootsh_stat

- name: Copy Oracle DB zip to staging (fallback when installer cloning did not reach this node)
  copy:
    src: "{{ local_installer_src }}/{{ oracle_db_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_db_zip }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  when:
    - inventory_hostname != oracle_node1_hostname
    - not db_home_rootsh_stat.stat.exists

- name: Extract Oracle DB zip on this node (fallback – replaces failed installer SSH cloning)
  become_user: "{{ oracle_user }}"
  unarchive:
    src: "{{ installer_stage }}/{{ oracle_db_zip }}"
    dest: "{{ oracle_home }}"
    remote_src: true
    creates: "{{ oracle_home }}/root.sh"
  when:
    - inventory_hostname != oracle_node1_hostname
    - not db_home_rootsh_stat.stat.exists

- name: Remove DB installer zip from staging after fallback extraction
  file:
    path: "{{ installer_stage }}/{{ oracle_db_zip }}"
    state: absent
  when:
    - inventory_hostname != oracle_node1_hostname
    - not db_home_rootsh_stat.stat.exists

# Oracle root.sh creates root_<hostname>_<timestamp>.log in
# $ORACLE_HOME/install/ on first execution – identical pattern to how
# grid_install.yml uses olr.loc as the CRS sentinel.  Presence of this
# file means root.sh already ran on this node; skip it to avoid spurious
# non-zero exits on re-runs which would drop the node from subsequent plays
# (DBCA) even though the DB home is correctly configured.
- name: Check if DB home root.sh was already run on this node (log sentinel)
  find:
    paths: "{{ oracle_home }}/install"
    patterns: "root_{{ inventory_hostname }}_*.log"
  register: db_rootsh_log_check
  failed_when: false

- name: Run DB home root.sh on ALL nodes (node1 first)
  command: "{{ oracle_home }}/root.sh"
  register: db_root_result
  changed_when: db_root_result.rc == 0
  when: db_rootsh_log_check.matched == 0

- name: Show root.sh output
  debug:
    var: db_root_result.stdout_lines
  when: db_rootsh_log_check.matched == 0 and db_root_result is defined
