---
# =============================================================================
# oracle_rac/tasks/pre_install.yml
# RAC-specific OS pre-requisites (run on ALL RAC nodes)
# =============================================================================

# Nodes are Oracle Linux 9.  The signing key ships with the OS at the path
# below; using it avoids an outbound HTTPS fetch for the key on every dnf run
# (a timed-out key fetch surfaces silently as "No package X available").
- name: Configure Oracle Linux 9 BaseOS repository
  yum_repository:
    name: ol9_baseos_latest
    description: "Oracle Linux 9 BaseOS Latest (x86_64)"
    baseurl: "https://yum.oracle.com/repo/OracleLinux/OL9/baseos/latest/x86_64/"
    gpgcheck: yes
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle"
    enabled: yes

- name: Configure Oracle Linux 9 UEK R7 repository
  yum_repository:
    name: ol9_UEKR7
    description: "Oracle Linux 9 UEK R7 (x86_64)"
    baseurl: "https://yum.oracle.com/repo/OracleLinux/OL9/UEKR7/x86_64/"
    gpgcheck: yes
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle"
    enabled: yes

- name: Install Oracle RAC prerequisite packages
  dnf:
    name:
      - oracle-database-preinstall-19c
    state: present

# oracleasm-support is not in any public OL9 repo (requires ULN subscription).
# ASM disk management is handled via udev rules instead – see asm_disks.yml.
# cvuqdisk is NOT in any public repo – it is extracted from the GI zip below.

# --- cvuqdisk: extract from GI installer media and push to nodes ----------
# Pre-check: give a clear error before attempting unzip if zip is missing.
- name: Verify Oracle GI zip exists on control node (early check for cvuqdisk)
  delegate_to: localhost
  become: false
  run_once: true
  stat:
    path: "{{ local_installer_src }}/{{ oracle_gi_zip }}"
  register: gi_zip_early_stat

- name: Fail early if Oracle GI zip is missing
  run_once: true
  fail:
    msg: |
      Oracle GI installer not found on the Ansible control node at:
        {{ local_installer_src }}/{{ oracle_gi_zip }}

      Download LINUX.X64_193000_grid_home.zip from Oracle eDelivery / MOS
      and place it in {{ local_installer_src }}/
      Or override the path:  -e local_installer_src=/your/media/path
  when: not gi_zip_early_stat.stat.exists

- name: Check if cvuqdisk RPM is already extracted on control node
  delegate_to: localhost
  become: false
  run_once: true
  find:
    paths: /tmp/cvuqdisk_extract
    patterns: "cvuqdisk*.rpm"
  register: cvuqdisk_cached
  failed_when: false

- name: Extract cvuqdisk RPM from Grid Infrastructure zip (runs on control node)
  delegate_to: localhost
  become: false
  run_once: true
  shell: >
    mkdir -p /tmp/cvuqdisk_extract &&
    unzip -j {{ local_installer_src }}/{{ oracle_gi_zip }}
    'cv/rpm/cvuqdisk*.rpm' -d /tmp/cvuqdisk_extract/
  when: cvuqdisk_cached.matched | default(0) == 0

- name: Find extracted cvuqdisk RPM on control node
  delegate_to: localhost
  become: false
  run_once: true
  find:
    paths: /tmp/cvuqdisk_extract
    patterns: "cvuqdisk*.rpm"
  register: cvuqdisk_rpm_file

- name: Fail if cvuqdisk RPM was not found after extraction
  run_once: true
  fail:
    msg: >
      cvuqdisk RPM not found in /tmp/cvuqdisk_extract/ after extraction.
      Check that the GI zip is not corrupt and contains cv/rpm/cvuqdisk*.rpm.
  when: cvuqdisk_rpm_file.files | length == 0

- name: Copy cvuqdisk RPM to remote nodes
  copy:
    src: "{{ cvuqdisk_rpm_file.files[0].path }}"
    dest: /tmp/cvuqdisk.rpm
    mode: '0644'

- name: Install cvuqdisk from extracted RPM
  dnf:
    name: /tmp/cvuqdisk.rpm
    state: present
    disable_gpg_check: true

- name: Set node-specific variables
  set_fact:
    node_number: "{{ '1' if inventory_hostname == oracle_node1_hostname else '2' }}"

- name: Create Grid home directory
  file:
    path: "{{ grid_home }}"
    state: directory
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'

- name: Create Oracle DB home directory
  file:
    path: "{{ oracle_home }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'

- name: Create SSH directory for oracle user
  file:
    path: /home/{{ oracle_user }}/.ssh
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0700'

- name: Create SSH directory for grid user
  file:
    path: /home/{{ grid_user }}/.ssh
    state: directory
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0700'

# SSH key exchange between RAC nodes (required by Oracle installer)
- name: Generate SSH key pair for oracle user
  become_user: "{{ oracle_user }}"
  openssh_keypair:
    path: /home/{{ oracle_user }}/.ssh/id_rsa
    type: rsa
    size: 2048
    force: false

- name: Generate SSH key pair for grid user
  become_user: "{{ grid_user }}"
  openssh_keypair:
    path: /home/{{ grid_user }}/.ssh/id_rsa
    type: rsa
    size: 2048
    force: false

- name: Fetch oracle public key from each node
  slurp:
    src: /home/{{ oracle_user }}/.ssh/id_rsa.pub
  register: oracle_pub_key

- name: Fetch grid public key from each node
  slurp:
    src: /home/{{ grid_user }}/.ssh/id_rsa.pub
  register: grid_pub_key

- name: Add oracle public keys to all RAC nodes
  authorized_key:
    user: "{{ oracle_user }}"
    key: "{{ hostvars[item]['oracle_pub_key']['content'] | b64decode }}"
    state: present
  loop: "{{ groups['rac_nodes'] }}"

- name: Add grid public keys to all RAC nodes
  authorized_key:
    user: "{{ grid_user }}"
    key: "{{ hostvars[item]['grid_pub_key']['content'] | b64decode }}"
    state: present
  loop: "{{ groups['rac_nodes'] }}"

# Read SSH host public keys directly from /etc/ssh/ on each node (no network scan needed).
# hostvars lets every node see every other node's registered values.
- name: Gather SSH host RSA key from each node
  slurp:
    src: /etc/ssh/ssh_host_rsa_key.pub
  register: node_host_rsa_key

- name: Gather SSH host ECDSA key from each node
  slurp:
    src: /etc/ssh/ssh_host_ecdsa_key.pub
  register: node_host_ecdsa_key

- name: Gather SSH host ed25519 key from each node
  slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: node_host_ed25519_key

# Write known_hosts entries keyed by both hostname AND IP so the Oracle GI installer
# can connect either way without host-key verification errors.  One blockinfile block
# per node keeps the task fully idempotent on re-runs.
- name: Write known_hosts for oracle user (hostname + IP entries from /etc/ssh)
  blockinfile:
    path: /home/{{ oracle_user }}/.ssh/known_hosts
    create: yes
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0600'
    marker: "# {mark} ANSIBLE MANAGED host key {{ item }}"
    block: |
      {{ item }} {{ hostvars[item]['node_host_rsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ item }} {{ hostvars[item]['node_host_ecdsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ item }} {{ hostvars[item]['node_host_ed25519_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['node_host_rsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['node_host_ecdsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['node_host_ed25519_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
  loop: "{{ groups['rac_nodes'] }}"

# Write known_hosts for grid user – same hostname + IP dual-entry approach.
- name: Write known_hosts for grid user (hostname + IP entries from /etc/ssh)
  blockinfile:
    path: /home/{{ grid_user }}/.ssh/known_hosts
    create: yes
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0600'
    marker: "# {mark} ANSIBLE MANAGED host key {{ item }}"
    block: |
      {{ item }} {{ hostvars[item]['node_host_rsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ item }} {{ hostvars[item]['node_host_ecdsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ item }} {{ hostvars[item]['node_host_ed25519_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['node_host_rsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['node_host_ecdsa_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
      {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['node_host_ed25519_key']['content'] | b64decode | trim | regex_replace('^(\S+\s+\S+).*$', '\1') }}
  loop: "{{ groups['rac_nodes'] }}"

# =============================================================================
# Oracle 19c / OL9 OpenSSH 8.7+ Backwards Compatibility Fixes
# 1. Enable deprecated ssh-rsa (required by JSch inside CVU)
# 2. Force legacy scp protocol (CVU cannot interpret SFTP output)
# =============================================================================
- name: Enable ssh-rsa protocol in SSH client config
  blockinfile:
    path: /etc/ssh/ssh_config.d/01-oracle-rsa.conf
    create: yes
    mode: '0644'
    block: |
      Host *
        PubkeyAcceptedKeyTypes +ssh-rsa
        HostKeyAlgorithms +ssh-rsa

- name: Enable ssh-rsa protocol in SSH server config
  blockinfile:
    path: /etc/ssh/sshd_config.d/01-oracle-rsa.conf
    create: yes
    mode: '0644'
    block: |
      PubkeyAcceptedKeyTypes +ssh-rsa
      HostKeyAlgorithms +ssh-rsa
  register: sshd_config_result

- name: Restart sshd if config changed
  service:
    name: sshd
    state: restarted
  when: sshd_config_result.changed

- name: Check if original scp was already backed up
  stat:
    path: /usr/bin/scp.orig
  register: scp_orig_stat

- name: Backup original scp
  command: mv /usr/bin/scp /usr/bin/scp.orig
  when: not scp_orig_stat.stat.exists

- name: Create legacy scp wrapper for Oracle 19c CVU
  copy:
    dest: /usr/bin/scp
    mode: '0755'
    content: |
      #!/bin/bash
      /usr/bin/scp.orig -O "$@"

- name: Verify passwordless SSH works for oracle user (fail fast before GI installer)
  become_user: "{{ oracle_user }}"
  command: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 {{ item }} hostname
  loop: "{{ groups['rac_nodes'] }}"
  changed_when: false

- name: Verify passwordless SSH works for grid user (fail fast before GI installer)
  become_user: "{{ grid_user }}"
  command: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 {{ item }} hostname
  loop: "{{ groups['rac_nodes'] }}"
  changed_when: false

- name: Verify Oracle GI zip exists on control node
  delegate_to: localhost
  become: false
  stat:
    path: "{{ local_installer_src }}/{{ oracle_gi_zip }}"
  register: gi_zip_stat

- name: Fail if Oracle GI zip is missing
  fail:
    msg: >
      Oracle GI installer not found at {{ local_installer_src }}/{{ oracle_gi_zip }}
      on the Ansible control node. Place the file there or override
      local_installer_src with -e local_installer_src=/path/to/media
  when: not gi_zip_stat.stat.exists

- name: Verify Oracle DB zip exists on control node
  delegate_to: localhost
  become: false
  stat:
    path: "{{ local_installer_src }}/{{ oracle_db_zip }}"
  register: db_zip_stat

- name: Fail if Oracle DB zip is missing
  fail:
    msg: >
      Oracle DB installer not found at {{ local_installer_src }}/{{ oracle_db_zip }}
      on the Ansible control node. Place the file there or override
      local_installer_src with -e local_installer_src=/path/to/media
  when: not db_zip_stat.stat.exists

- name: Check if GI home is already extracted
  stat:
    path: "{{ grid_home }}/gridSetup.sh"
  register: gi_home_stat

- name: Copy Oracle GI installer zip to staging area on remote
  copy:
    src: "{{ local_installer_src }}/{{ oracle_gi_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_gi_zip }}"
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  when: not gi_home_stat.stat.exists

- name: Unzip Oracle GI installer
  become_user: "{{ grid_user }}"
  unarchive:
    src: "{{ installer_stage }}/{{ oracle_gi_zip }}"
    dest: "{{ grid_home }}"
    remote_src: true
    creates: "{{ grid_home }}/gridSetup.sh"

- name: Remove GI installer zip from staging (free disk space before DB installer)
  file:
    path: "{{ installer_stage }}/{{ oracle_gi_zip }}"
    state: absent

- name: Check if DB home is already extracted
  stat:
    path: "{{ oracle_home }}/runInstaller"
  register: db_home_stat

- name: Copy Oracle DB installer zip to staging area on remote
  copy:
    src: "{{ local_installer_src }}/{{ oracle_db_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_db_zip }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  when: not db_home_stat.stat.exists

- name: Unzip Oracle DB installer
  become_user: "{{ oracle_user }}"
  unarchive:
    src: "{{ installer_stage }}/{{ oracle_db_zip }}"
    dest: "{{ oracle_home }}"
    remote_src: true
    creates: "{{ oracle_home }}/runInstaller"

- name: Remove DB installer zip from staging (free disk space)
  file:
    path: "{{ installer_stage }}/{{ oracle_db_zip }}"
    state: absent
