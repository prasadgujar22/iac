---
# =============================================================================
# oracle_rac/tasks/pre_install.yml
# RAC-specific OS pre-requisites (run on ALL RAC nodes)
# =============================================================================

# oracleasm-support and kmod-oracleasm live in the Oracle Linux UEK repo.
# Enable it first so dnf can resolve those packages.
- name: Enable Oracle Linux UEK and base repositories
  command: >
    dnf config-manager --enable
    ol8_baseos_latest ol8_appstream ol8_UEKR6
  changed_when: false
  ignore_errors: true   # repo names differ slightly between OL sub-releases

- name: Install Oracle RAC prerequisite packages
  dnf:
    name:
      - oracle-database-preinstall-19c
      - oracleasm-support
      - kmod-oracleasm
    state: present
  # cvuqdisk is NOT in any public repo – it is extracted from the GI zip below.

# --- cvuqdisk: extract from GI installer media and push to nodes ----------
- name: Extract cvuqdisk RPM from Grid Infrastructure zip (runs on control node)
  delegate_to: localhost
  become: false
  run_once: true
  shell: >
    mkdir -p /tmp/cvuqdisk_extract &&
    unzip -j {{ local_installer_src }}/{{ oracle_gi_zip }}
    'cv/rpm/cvuqdisk*.rpm' -d /tmp/cvuqdisk_extract/
  args:
    creates: /tmp/cvuqdisk_extract

- name: Copy cvuqdisk RPM to remote nodes
  copy:
    src: "{{ lookup('fileglob', '/tmp/cvuqdisk_extract/cvuqdisk*.rpm') | first }}"
    dest: /tmp/cvuqdisk.rpm
    mode: '0644'

- name: Install cvuqdisk from extracted RPM
  dnf:
    name: /tmp/cvuqdisk.rpm
    state: present
    disable_gpg_check: true

- name: Enable oracleasm module
  command: modprobe oracleasm
  changed_when: false

- name: Configure oracleasm
  command: >
    /usr/sbin/oracleasm configure -i
    -u {{ grid_user }}
    -g asmadmin
    -b y
    -s y
  args:
    creates: /etc/sysconfig/oracleasm

- name: Initialize oracleasm
  command: /usr/sbin/oracleasm init
  changed_when: false

- name: Set node-specific variables
  set_fact:
    node_number: "{{ '1' if inventory_hostname == oracle_node1_hostname else '2' }}"

- name: Create Grid home directory
  file:
    path: "{{ grid_home }}"
    state: directory
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'

- name: Create Oracle DB home directory
  file:
    path: "{{ oracle_home }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'

- name: Create SSH directory for oracle user
  file:
    path: /home/{{ oracle_user }}/.ssh
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0700'

- name: Create SSH directory for grid user
  file:
    path: /home/{{ grid_user }}/.ssh
    state: directory
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0700'

# SSH key exchange between RAC nodes (required by Oracle installer)
- name: Generate SSH key pair for oracle user
  become_user: "{{ oracle_user }}"
  openssh_keypair:
    path: /home/{{ oracle_user }}/.ssh/id_rsa
    type: rsa
    size: 2048
    force: false

- name: Generate SSH key pair for grid user
  become_user: "{{ grid_user }}"
  openssh_keypair:
    path: /home/{{ grid_user }}/.ssh/id_rsa
    type: rsa
    size: 2048
    force: false

- name: Fetch oracle public key from each node
  slurp:
    src: /home/{{ oracle_user }}/.ssh/id_rsa.pub
  register: oracle_pub_key

- name: Fetch grid public key from each node
  slurp:
    src: /home/{{ grid_user }}/.ssh/id_rsa.pub
  register: grid_pub_key

- name: Add oracle public keys to all RAC nodes
  authorized_key:
    user: "{{ oracle_user }}"
    key: "{{ hostvars[item]['oracle_pub_key']['content'] | b64decode }}"
    state: present
  loop: "{{ groups['rac_nodes'] }}"

- name: Add grid public keys to all RAC nodes
  authorized_key:
    user: "{{ grid_user }}"
    key: "{{ hostvars[item]['grid_pub_key']['content'] | b64decode }}"
    state: present
  loop: "{{ groups['rac_nodes'] }}"

- name: Populate SSH known_hosts for oracle user (avoid first-connect prompt)
  become_user: "{{ oracle_user }}"
  known_hosts:
    name: "{{ item }}"
    state: present
    hash_host: false
    key: "{{ lookup('pipe', 'ssh-keyscan -H ' + item + ' 2>/dev/null') }}"
  loop: "{{ groups['rac_nodes'] | map('extract', hostvars, 'ansible_host') | list }}"
  ignore_errors: true

- name: Populate SSH known_hosts for grid user
  become_user: "{{ grid_user }}"
  known_hosts:
    name: "{{ item }}"
    state: present
    hash_host: false
    key: "{{ lookup('pipe', 'ssh-keyscan -H ' + item + ' 2>/dev/null') }}"
  loop: "{{ groups['rac_nodes'] | map('extract', hostvars, 'ansible_host') | list }}"
  ignore_errors: true

- name: Verify Oracle GI zip exists on control node
  delegate_to: localhost
  become: false
  stat:
    path: "{{ local_installer_src }}/{{ oracle_gi_zip }}"
  register: gi_zip_stat

- name: Fail if Oracle GI zip is missing
  fail:
    msg: >
      Oracle GI installer not found at {{ local_installer_src }}/{{ oracle_gi_zip }}
      on the Ansible control node. Place the file there or override
      local_installer_src with -e local_installer_src=/path/to/media
  when: not gi_zip_stat.stat.exists

- name: Verify Oracle DB zip exists on control node
  delegate_to: localhost
  become: false
  stat:
    path: "{{ local_installer_src }}/{{ oracle_db_zip }}"
  register: db_zip_stat

- name: Fail if Oracle DB zip is missing
  fail:
    msg: >
      Oracle DB installer not found at {{ local_installer_src }}/{{ oracle_db_zip }}
      on the Ansible control node. Place the file there or override
      local_installer_src with -e local_installer_src=/path/to/media
  when: not db_zip_stat.stat.exists

- name: Copy Oracle GI installer zip to staging area on remote
  copy:
    src: "{{ local_installer_src }}/{{ oracle_gi_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_gi_zip }}"
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'

- name: Copy Oracle DB installer zip to staging area on remote
  copy:
    src: "{{ local_installer_src }}/{{ oracle_db_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_db_zip }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'

- name: Unzip Oracle GI installer
  become_user: "{{ grid_user }}"
  unarchive:
    src: "{{ installer_stage }}/{{ oracle_gi_zip }}"
    dest: "{{ grid_home }}"
    remote_src: true
    creates: "{{ grid_home }}/gridSetup.sh"

- name: Unzip Oracle DB installer
  become_user: "{{ oracle_user }}"
  unarchive:
    src: "{{ installer_stage }}/{{ oracle_db_zip }}"
    dest: "{{ oracle_home }}"
    remote_src: true
    creates: "{{ oracle_home }}/runInstaller"
