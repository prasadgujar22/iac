---
# =============================================================================
# oracle_rac/tasks/asm_disks.yml
# Prepare ASM disks using udev rules (no oracleasm/ASMLib required).
#
# Oracle 19c's GI installer on OL9/RHEL9 (kernel 5.14+) rejects whole-disk
# block devices with [INS-30508].  The workaround is to create a single GPT
# partition on each disk and present the *partition* to ASM.
#
# udev sets ownership to grid:asmadmin with mode 0660 on every boot and
# whenever the partition device appears.  GI discovers the partitions via
# diskDiscoveryString=/dev/sd[b-z]1.
# =============================================================================

# --- Wipe existing state from the parent disks ---

- name: Wipe signatures from DATA disk
  command: wipefs -af {{ asm_data_disk }}
  changed_when: false

- name: Wipe signatures from FRA disk
  command: wipefs -af {{ asm_fra_disk }}
  changed_when: false

- name: Zero the first MB of DATA disk
  command: dd if=/dev/zero of={{ asm_data_disk }} bs=1M count=1
  changed_when: false

- name: Zero the first MB of FRA disk
  command: dd if=/dev/zero of={{ asm_fra_disk }} bs=1M count=1
  changed_when: false

# --- Create a single GPT partition spanning the full disk ---
# The GI 19c installer validates partitions correctly but rejects whole-disk
# devices on OL9.

- name: Create GPT partition on DATA disk
  command: parted -s {{ asm_data_disk }} mklabel gpt mkpart primary 0% 100%
  changed_when: false

- name: Create GPT partition on FRA disk
  command: parted -s {{ asm_fra_disk }} mklabel gpt mkpart primary 0% 100%
  changed_when: false

# Force the kernel to re-read the new partition tables.
- name: Inform kernel of new partition tables
  command: partprobe {{ item }}
  loop:
    - "{{ asm_data_disk }}"
    - "{{ asm_fra_disk }}"
  changed_when: false

# Give the kernel a moment to create the partition device nodes.
- name: Wait for ASM partition devices to appear
  wait_for:
    path: "{{ item }}"
    state: present
    timeout: 10
  loop:
    - "{{ asm_data_partition }}"
    - "{{ asm_fra_partition }}"

# Clean any residual filesystem signatures from the fresh partitions.
- name: Wipe filesystem signatures from ASM partitions
  command: wipefs -af {{ item }}
  loop:
    - "{{ asm_data_partition }}"
    - "{{ asm_fra_partition }}"
  changed_when: false

# --- udev rules: persistent ownership on every boot ---

- name: Deploy udev rules for ASM partition ownership
  template:
    src: oracle-asmdevices.rules.j2
    dest: /etc/udev/rules.d/99-oracle-asmdevices.rules
    owner: root
    group: root
    mode: '0644'

- name: Reload udev rules
  command: udevadm control --reload-rules
  changed_when: false

- name: Apply udev rules to ASM partition devices
  command: udevadm trigger --type=devices --action=change
  changed_when: false

# udevadm trigger is asynchronous; settle waits for all queued events so
# permissions are guaranteed before any downstream task checks them.
- name: Wait for udev to finish processing ASM device events
  command: udevadm settle --timeout=30
  changed_when: false

# Belt-and-suspenders: apply ownership/mode directly in case the udev rule
# missed (e.g. a race during the trigger or a rule-syntax mismatch).
- name: Set ASM partition ownership and mode (fallback after udev)
  file:
    path: "{{ item }}"
    owner: "{{ grid_user }}"
    group: asmadmin
    mode: '0660'
  loop:
    - "{{ asm_data_partition }}"
    - "{{ asm_fra_partition }}"

# --- Verification ---

- name: Verify DATA partition ownership (grid:asmadmin)
  stat:
    path: "{{ asm_data_partition }}"
  register: asm_data_stat

- name: Verify FRA partition ownership (grid:asmadmin)
  stat:
    path: "{{ asm_fra_partition }}"
  register: asm_fra_stat

- name: Show ASM partition permissions
  debug:
    msg:
      - "{{ asm_data_partition }}: owner={{ asm_data_stat.stat.pw_name }}, group={{ asm_data_stat.stat.gr_name }}, mode={{ asm_data_stat.stat.mode }}"
      - "{{ asm_fra_partition }}:  owner={{ asm_fra_stat.stat.pw_name }}, group={{ asm_fra_stat.stat.gr_name }}, mode={{ asm_fra_stat.stat.mode }}"

# Hard-stop here rather than letting the GI installer produce a cryptic
# [INS-30508] message 40 seconds later.
- name: Assert ASM partition permissions are correct before continuing
  assert:
    that:
      - asm_data_stat.stat.pw_name == grid_user
      - asm_data_stat.stat.gr_name == 'asmadmin'
      - asm_fra_stat.stat.pw_name  == grid_user
      - asm_fra_stat.stat.gr_name  == 'asmadmin'
    fail_msg: >
      ASM partition permissions are wrong – the grid user will not be able to
      open the block devices and gridSetup.sh will fail with [INS-30508].
      Check udev rules in /etc/udev/rules.d/99-oracle-asmdevices.rules and
      verify that the 'grid' user is a member of the 'asmadmin' group.
