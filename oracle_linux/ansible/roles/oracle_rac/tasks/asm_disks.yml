---
# =============================================================================
# oracle_rac/tasks/asm_disks.yml
# Prepare ASM disks using udev rules (no oracleasm/ASMLib required).
#
# udev sets ownership to grid:asmadmin with mode 0660 on every boot and
# whenever the device appears.  GI discovers the disks via the raw device
# path using diskDiscoveryString=/dev/sd[b-z].
# =============================================================================

- name: Wipe partition table from DATA disk
  command: wipefs -a {{ asm_data_disk }}
  changed_when: false

- name: Wipe partition table from FRA disk
  command: wipefs -a {{ asm_fra_disk }}
  changed_when: false

- name: Zero out the first MB of DATA disk (ensure clean state)
  command: dd if=/dev/zero of={{ asm_data_disk }} bs=1M count=1
  changed_when: false

- name: Zero out the first MB of FRA disk
  command: dd if=/dev/zero of={{ asm_fra_disk }} bs=1M count=1
  changed_when: false

- name: Deploy udev rules for ASM disk ownership
  template:
    src: oracle-asmdevices.rules.j2
    dest: /etc/udev/rules.d/99-oracle-asmdevices.rules
    owner: root
    group: root
    mode: '0644'

- name: Reload udev rules
  command: udevadm control --reload-rules
  changed_when: false

- name: Apply udev rules to existing ASM devices
  command: udevadm trigger --type=devices --action=change
  changed_when: false

- name: Verify DATA disk ownership (grid:asmadmin)
  stat:
    path: "{{ asm_data_disk }}"
  register: asm_data_stat

- name: Verify FRA disk ownership (grid:asmadmin)
  stat:
    path: "{{ asm_fra_disk }}"
  register: asm_fra_stat

- name: Show ASM disk permissions
  debug:
    msg:
      - "{{ asm_data_disk }}: owner={{ asm_data_stat.stat.pw_name }}, group={{ asm_data_stat.stat.gr_name }}, mode={{ asm_data_stat.stat.mode }}"
      - "{{ asm_fra_disk }}:  owner={{ asm_fra_stat.stat.pw_name }}, group={{ asm_fra_stat.stat.gr_name }}, mode={{ asm_fra_stat.stat.mode }}"
