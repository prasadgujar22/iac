---
# =============================================================================
# oracle_rac/tasks/grid_install.yml
# Oracle Grid Infrastructure 19c silent installation
# Run on node1 first; the installer automatically configures node2 via SSH
# =============================================================================

- name: Pre-flight – verify grid user can read ASM partitions
  become_user: "{{ grid_user }}"
  command: dd if={{ item }} of=/dev/null bs=512 count=1
  loop:
    - "{{ asm_data_partition }}"
    - "{{ asm_fra_partition }}"
  changed_when: false

# libclntshcore.so is NOT included in the Grid Infrastructure zip; it ships
# with the Oracle Database software.  The GI installer needs it in two ways:
#
#   1. Runtime (kfod.bin, validation phase): needs libclntshcore.so.19.1
#      to be loadable – satisfied by ldconfig knowing about the versioned file.
#
#   2. Link-time (make libasmperl19.so): orald passes -lclntshcore to
#      /usr/bin/ld, which searches for the UNVERSIONED libclntshcore.so stub.
#      Without it the build step fails with "cannot find -lclntshcore".
#
# We expose both names in /usr/lib64 (always on the system linker path) so
# both phases work without touching the GI home directories.
# Only node1 needs this; node2 runs orainstRoot/root.sh after node1 has
# already built and configured everything via SSH.
- name: Find libclntshcore.so.19.1 in Grid or Oracle DB home (node1 only)
  shell: >
    find {{ grid_home }} {{ oracle_home }}
    -name "libclntshcore.so.19.1" 2>/dev/null | head -1
  register: libclntshcore_find
  changed_when: false
  failed_when: false
  when: inventory_hostname == oracle_node1_hostname

- name: Fail if libclntshcore.so.19.1 not found in Grid or Oracle DB home
  fail:
    msg: >
      libclntshcore.so.19.1 was not found in {{ grid_home }} or {{ oracle_home }}.
      Ensure both the GI zip ({{ oracle_gi_zip }}) and the DB zip
      ({{ oracle_db_zip }}) have been fully extracted before this play runs.
  when:
    - inventory_hostname == oracle_node1_hostname
    - libclntshcore_find.stdout | trim == ''

- name: Symlink libclntshcore.so.19.1 into /usr/lib64 (runtime – kfod.bin)
  file:
    src: "{{ libclntshcore_find.stdout | trim }}"
    dest: /usr/lib64/libclntshcore.so.19.1
    state: link
    force: true
  when:
    - inventory_hostname == oracle_node1_hostname
    - libclntshcore_find.stdout | trim != ''

- name: Symlink libclntshcore.so into /usr/lib64 (link-time – orald -lclntshcore)
  file:
    src: "{{ libclntshcore_find.stdout | trim }}"
    dest: /usr/lib64/libclntshcore.so
    state: link
    force: true
  when:
    - inventory_hostname == oracle_node1_hostname
    - libclntshcore_find.stdout | trim != ''

- name: Rebuild dynamic linker cache after adding Oracle library symlinks
  command: ldconfig
  changed_when: false

# Oracle 19c GI static archives (libnnzst19.a, libnnz19.a …) were compiled on
# OL7 / glibc 2.17 where stat() was a real external symbol in libc.so.6.
# On OL9 / glibc 2.33+, stat() was reimplemented as an inline wrapper around
# the statx() syscall and is no longer exported as a linkable symbol from
# libc.so.6.  When the GI installer's make step links orion and other binaries
# against those static archives the GNU linker fails with:
#   "undefined reference to `stat'"
#
# Fix: compile a shim shared library that re-exports stat() as a real function,
# install it into /usr/lib64, and prepend it to the GI home's sysliblist so
# every orald invocation picks it up automatically — without touching the
# Oracle makefiles.
#
# Implementation note: the shim uses syscall(SYS_newfstatat, …) rather than
# calling fstatat() directly.  fstatat() was given the versioned symbol
# fstatat@GLIBC_2.33 in glibc 2.33 (64-bit stat ABI cleanup); Oracle 19c ships
# OL7-era libc stubs in grid/lib/stubs/ that predate glibc 2.33 and do not
# export that versioned symbol.  When orald links tnsping / itnsping it searches
# those stubs first and fails with:
#   "undefined reference to `fstatat@GLIBC_2.33'"
# syscall() has been available as GLIBC_2.0 since the dawn of Linux glibc and
# is present in every Oracle stub set, so it resolves cleanly.
- name: Install gcc for stat() shim compilation (node1 only)
  package:
    name: gcc
    state: present
  when: inventory_hostname == oracle_node1_hostname

- name: Write stat() compatibility shim source (glibc 2.33+ / OL9 workaround)
  copy:
    content: |
      #define _GNU_SOURCE
      #include <sys/stat.h>
      #include <sys/types.h>
      #include <sys/syscall.h>
      #include <fcntl.h>
      #include <unistd.h>
      /* Re-export stat() as a real function for Oracle 19c static archives
       * compiled on OL7 where stat was a genuine external symbol.
       * Use syscall(SYS_newfstatat) rather than fstatat() to avoid the
       * fstatat@GLIBC_2.33 versioned symbol that Oracle's OL7-era stubs
       * do not export. */
      int stat(const char *pathname, struct stat *statbuf)
      { return (int)syscall(SYS_newfstatat, AT_FDCWD, pathname, statbuf, 0); }
    dest: /tmp/oracle_stat_compat.c
    mode: '0644'
  when: inventory_hostname == oracle_node1_hostname

- name: Compile stat() shim into shared library (/usr/lib64/liborastat_compat.so)
  command: >
    gcc -shared -fPIC -O2
    -o /usr/lib64/liborastat_compat.so
    /tmp/oracle_stat_compat.c
  args:
    creates: /usr/lib64/liborastat_compat.so
  when: inventory_hostname == oracle_node1_hostname

- name: Rebuild dynamic linker cache to register stat() shim
  command: ldconfig
  changed_when: false
  when: inventory_hostname == oracle_node1_hostname

- name: Prepend stat() shim to Oracle GI sysliblist (picked up by all orald calls)
  lineinfile:
    path: "{{ grid_home }}/lib/sysliblist"
    line: "-lorastat_compat"
    regexp: "-lorastat_compat"
    insertbefore: BOF
  when: inventory_hostname == oracle_node1_hostname

- name: Generate Grid Infrastructure response file
  template:
    src: grid_install_response.j2
    dest: "{{ installer_stage }}/grid_install.rsp"
    owner: "{{ grid_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'
  when: inventory_hostname == oracle_node1_hostname

# If a previous GI installer run failed before orainstRoot.sh had a chance to
# create /etc/oraInst.loc, the Oracle inventory directory may already exist on
# disk but contain no registered Oracle homes.  The GI installer treats any
# non-empty directory at INVENTORY_LOCATION as a fatal conflict ([INS-32035])
# and aborts immediately.  Clean up the stale directory on every node where
# no oraInst.loc is present so the installer can create a fresh inventory.
- name: Check whether Oracle inventory is registered (oraInst.loc present)
  stat:
    path: /etc/oraInst.loc
  register: orainst_loc_stat

- name: Remove stale Oracle inventory directory (no registered inventory found)
  file:
    path: "{{ oracle_inventory }}"
    state: absent
  when: not orainst_loc_stat.stat.exists

- when: inventory_hostname == oracle_node1_hostname
  block:
    - name: Run Grid Infrastructure installer (silent) – node1 only
      become_user: "{{ grid_user }}"
      command: >
        {{ grid_home }}/gridSetup.sh
        -silent
        -responseFile {{ installer_stage }}/grid_install.rsp
        -ignorePrereqFailure
      environment:
        CV_ASSUME_DISTID: OEL7.6
        LD_LIBRARY_PATH: "{{ grid_home }}/lib"
      register: gi_install_result
      failed_when: >
        gi_install_result.rc not in [0, 6] and
        'Successfully Setup Software' not in gi_install_result.stdout
      changed_when: >
        'Successfully Setup Software' in gi_install_result.stdout
      async: 3600
      poll: 30
  always:
    # Always show the last 80 lines of the most recent GI log so that any
    # [INS-*] errors are visible in the Ansible output without manual SSH.
    - name: Show GI installer log tail (most recent session)
      shell: |
        logdir=$(ls -dt /u01/app/oraInventory/logs/GridSetupActions* 2>/dev/null | head -1)
        if [ -z "$logdir" ]; then echo "No GI log directory found."; exit 0; fi
        # gridSetupActions*.log is the detailed installer log; time*.log is only
        # the state-machine trace and has no diagnostic content.
        logfile=$(ls -t "$logdir"/gridSetupActions*.log 2>/dev/null | head -1)
        if [ -z "$logfile" ]; then
          logfile=$(ls -t "$logdir"/*.log 2>/dev/null | head -1)
        fi
        if [ -z "$logfile" ]; then echo "No log file in $logdir"; exit 0; fi
        echo "=== $logfile (last 100 lines) ==="
        tail -100 "$logfile"
      args:
        executable: /bin/bash
      register: gi_log_tail
      changed_when: false
      failed_when: false
    - name: Print GI installer log
      debug:
        var: gi_log_tail.stdout_lines
      when: gi_log_tail is defined

- name: Run orainstRoot.sh on ALL nodes
  command: /u01/app/oraInventory/orainstRoot.sh
  register: orainst_result
  changed_when: orainst_result.rc == 0
  ignore_errors: true

- name: Run grid root.sh on ALL nodes (sequentially – node1 then node2)
  command: "{{ grid_home }}/root.sh"
  register: grid_root_result
  changed_when: grid_root_result.rc == 0
  # Run on node1 first, then node2 – enforce with serial: 1 in playbook

- name: Show grid root.sh output
  debug:
    var: grid_root_result.stdout_lines

- name: Execute Grid Configuration Assistant (GRIDCA) – node1 only
  become_user: "{{ grid_user }}"
  command: >
    {{ grid_home }}/gridSetup.sh
    -silent
    -executeConfigTools
    -responseFile {{ installer_stage }}/grid_install.rsp
    -ignorePrereqFailure
  environment:
    CV_ASSUME_DISTID: OEL7.6
    LD_LIBRARY_PATH: "{{ grid_home }}/lib"
  register: gridca_result
  failed_when: gridca_result.rc not in [0, 6]
  changed_when: true
  when: inventory_hostname == oracle_node1_hostname
  async: 1800
  poll: 30

- name: Verify clusterware is running
  become_user: "{{ grid_user }}"
  command: "{{ grid_home }}/bin/crsctl check cluster -all"
  register: crs_status
  changed_when: false
  when: inventory_hostname == oracle_node1_hostname

- name: Show cluster status
  debug:
    var: crs_status.stdout_lines
  when: inventory_hostname == oracle_node1_hostname
