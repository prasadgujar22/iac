---
# =============================================================================
# Oracle RAC 19c – group variables for [rac_nodes]
# =============================================================================

# --- Oracle Grid Infrastructure ---
grid_home: /u01/app/19.0.0/grid
oracle_gi_version: 19.0.0

# --- Oracle DB home ---
oracle_home: /u01/app/oracle/product/19.0.0/dbhome_1
oracle_db_version: 19.0.0

# --- Cluster name & SCAN ---
cluster_name: jms-poc-cluster
scan_name: rac-scan
scan_port: 1521

# --- ASM disk device paths (as seen inside the VMs) ---
# scsi1 → DATA diskgroup, scsi2 → FRA diskgroup (from Terraform)
asm_data_disk: /dev/sdb
asm_fra_disk: /dev/sdc
# Partition devices created by asm_disks.yml – the GI 19c installer on OL9
# rejects whole-disk block devices ([INS-30508]), so we partition each disk
# and point ASM at the partitions instead.
asm_data_partition: /dev/sdb1
asm_fra_partition: /dev/sdc1
asm_data_diskgroup: DATA
asm_fra_diskgroup: FRA
asm_redundancy: EXTERNAL      # Use NORMAL/HIGH when you have real shared storage

# --- Oracle RAC database ---
oracle_db_name: RACDB
oracle_pdb_name: RACPDB
oracle_db_unique_name: RACDB
oracle_db_char_set: AL32UTF8
oracle_db_nchar_set: AL16UTF16
oracle_db_type: RAC
oracle_memory_target_mb: 4096   # per node (8GB RAM → 4GB for SGA+PGA)

# --- Passwords (override with ansible-vault in production) ---
oracle_sys_password: Oracle_SYS_Passw0rd
oracle_system_password: Oracle_SYS_Passw0rd
oracle_asmsnmp_password: Oracle_ASM_Passw0rd
