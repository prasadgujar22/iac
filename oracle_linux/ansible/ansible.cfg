[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
host_key_checking  = False
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = timer, profile_tasks
forks              = 10
timeout            = 60
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout    = 86400

# Use 'su' instead of 'sudo' for become_user.
# The sudo path is broken on this OL9 host: the sudoers_audit PAM plugin
# fails to initialise (auditd not running in VM/container), which causes
# sudo to report "unknown user" for any become_user target.
# 'su <user>' from root bypasses sudo/PAM entirely (setresuid only).
become_method      = su

# Required when pipelining=True and become_user targets a non-root user.
# setfacl is the preferred mechanism; this is the fallback for hosts
# where ACL support on /tmp (tmpfs) is unavailable or broken.
allow_world_readable_tmpfiles = True

[ssh_connection]
pipelining         = True
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60
