[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
host_key_checking  = False
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = timer, profile_tasks
forks              = 10
timeout            = 60
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout    = 86400

# Required when pipelining=True and become_user targets a non-root user.
# setfacl (acl package) is the preferred mechanism; this is the fallback
# for hosts where ACL support on /tmp (tmpfs) is unavailable or broken.
allow_world_readable_tmpfiles = True

[ssh_connection]
pipelining         = True
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60
