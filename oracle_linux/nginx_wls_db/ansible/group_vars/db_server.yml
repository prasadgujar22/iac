---
# =============================================================================
# group_vars/db_server.yml – Oracle Database 19c standalone
# =============================================================================

# --- Oracle RDBMS home ---
oracle_home:       /u01/app/oracle/product/19.0.0/dbhome_1
oracle_db_version: 19.0.0

# --- Database configuration ---
oracle_db_name:        WLSDB
oracle_pdb_name:       WLSPDB
oracle_db_unique_name: WLSDB
oracle_db_char_set:    AL32UTF8
oracle_db_nchar_set:   AL16UTF16
oracle_db_type:        SINGLE
oracle_memory_target_mb: 4096   # 4 GB SGA+PGA (adjust to your VM RAM)
oracle_processes:      300

# --- Storage paths (raw block devices added by Terraform) ---
# /dev/sdb → Oracle datafiles
# /dev/sdc → Fast Recovery Area
oracle_data_disk:   /dev/sdb
oracle_fra_disk:    /dev/sdc
oracle_data_dir:    /u01/app/oracle/oradata
oracle_fra_dir:     /u01/app/oracle/fra
oracle_fra_size_mb: 51200          # 50 GB

# --- Oracle Net listener ---
listener_name: LISTENER
listener_port: 1521

# --- Application schema for WebLogic ---
oracle_app_schema_user:     wlsapp
oracle_app_schema_password: Wlsapp_Passw0rd1
oracle_app_tablespace:      WLSAPP_DATA

# --- Passwords (encrypt with ansible-vault in production) ---
oracle_sys_password:    Oracle_SYS_Passw0rd
oracle_system_password: Oracle_SYS_Passw0rd
oracle_dbsnmp_password: Oracle_SYS_Passw0rd
