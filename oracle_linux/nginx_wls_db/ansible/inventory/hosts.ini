# =============================================================================
# Ansible Inventory – Nginx + WebLogic Cluster + Oracle DB
# =============================================================================
# Matches Terraform-provisioned VMs in nginx_wls_db/terraform/main.tf
# -----------------------------------------------------------------------------

# --- Nginx load balancer ---
[nginx]
nginx-server ansible_host=192.168.29.130

# --- WebLogic Administration Server ---
[wls_admin]
wls-admin ansible_host=192.168.29.131

# --- WebLogic Managed Servers (2-node cluster) ---
[wls_managed]
wls-node1 ansible_host=192.168.29.132
wls-node2 ansible_host=192.168.29.133

# --- All WebLogic nodes (admin + managed) ---
[wls_nodes:children]
wls_admin
wls_managed

# --- Oracle Database server ---
[db_server]
oracle-db ansible_host=192.168.29.134

# --- Global connection variables ---
[all:vars]
ansible_user=prasad
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
