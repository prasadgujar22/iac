---
# =============================================================================
# Create application schema for WebLogic datasource
# =============================================================================

- name: Deploy app schema SQL script
  ansible.builtin.template:
    src: create_app_schema.sql.j2
    dest: "{{ installer_stage }}/create_app_schema.sql"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Create WebLogic application schema in PDB
  ansible.builtin.command: >
    {{ oracle_home }}/bin/sqlplus -s /nolog
    @{{ installer_stage }}/create_app_schema.sql
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID:  "{{ oracle_db_name }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_facts['env']['PATH'] }}"
  register: schema_result
  changed_when: '"User created" in schema_result.stdout'
  failed_when:
    - schema_result.rc != 0
    - '"ORA-01920" not in schema_result.stdout'  # user already exists
