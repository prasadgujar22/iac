---
# =============================================================================
# Oracle Database 19c software installation (silent)
# =============================================================================

- name: Copy Oracle DB installer to staging area
  ansible.builtin.copy:
    src: "{{ local_installer_src }}/{{ oracle_db_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_db_zip }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when: oracle_db_zip != ''

- name: Unzip Oracle DB installer into ORACLE_HOME
  ansible.builtin.unarchive:
    src: "{{ installer_stage }}/{{ oracle_db_zip }}"
    dest: "{{ oracle_home }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    remote_src: true
    creates: "{{ oracle_home }}/runInstaller"

# bin/oracle ships inside the 19c zip, so it exists right after unzip.
# libclntshcore.so.19.1 is only created by a successful runInstaller.
- name: Check if Oracle software is already installed
  ansible.builtin.stat:
    path: "{{ oracle_home }}/lib/libclntshcore.so.19.1"
  register: oracle_installed

# Oracle 19.3 ins_rdbms.mk uses ORACLE_LINKLINE for shared library targets
# (libasmclntsh19.ohso etc.) and RDBMS_LINK_OPTS for other targets.
# Both need -Wl,--no-as-needed to work with binutils >= 2.35 (OL9).
- name: Patch ins_rdbms.mk ORACLE_LINKLINE for OL9/GCC11 compatibility
  ansible.builtin.replace:
    path: "{{ oracle_home }}/rdbms/lib/ins_rdbms.mk"
    regexp: '^(ORACLE_LINKLINE\s*=\s*)(.*)'
    replace: '\1\2 -Wl,--no-as-needed'
  become: true
  become_user: "{{ oracle_user }}"
  when: not oracle_installed.stat.exists

- name: Patch ins_rdbms.mk RDBMS_LINK_OPTS for OL9/GCC11 compatibility
  ansible.builtin.replace:
    path: "{{ oracle_home }}/rdbms/lib/ins_rdbms.mk"
    regexp: '^(RDBMS_LINK_OPTS\s*=\s*)(.*)'
    replace: '\1\2 -Wl,--no-as-needed'
  become: true
  become_user: "{{ oracle_user }}"
  when: not oracle_installed.stat.exists

# libasmperl19.so links against -lclntshcore and -lclntsh at build time.
# On OL9 the stubs in $ORACLE_HOME/lib/stubs/ are absent or invalid for
# the newer binutils, so the linker fails with "cannot find -lclntshcore".
# Create valid empty ELF stub SOs so the ASM library build can proceed.
- name: Create libclntshcore and libclntsh ELF stubs for ASM library build
  ansible.builtin.shell: |
    set -e
    for lib in libclntshcore libclntsh; do
      stub="{{ oracle_home }}/lib/stubs/${lib}.so"
      if [ ! -s "$stub" ] || ! file "$stub" | grep -q ELF; then
        printf 'void %s_stub(void) {}' "$lib" | \
          gcc -x c -shared -fPIC -o "$stub" -
      fi
    done
  become: true
  become_user: "{{ oracle_user }}"
  when: not oracle_installed.stat.exists
  changed_when: true

# genclntsh (Oracle client library builder) references /usr/lib64/libpthread_nonshared.a
# which was removed in glibc 2.34 (OL9). Create an empty static archive stub.
- name: Create libpthread_nonshared.a stub for Oracle genclntsh on OL9
  ansible.builtin.command: ar crs /usr/lib64/libpthread_nonshared.a
  args:
    creates: /usr/lib64/libpthread_nonshared.a

- name: Reset Oracle inventory from previous failed install
  ansible.builtin.file:
    path: "{{ oracle_inventory }}"
    state: "{{ item }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  loop:
    - absent
    - directory
  when: not oracle_installed.stat.exists

- name: Deploy Oracle DB silent response file
  ansible.builtin.template:
    src: db_install.rsp.j2
    dest: "{{ installer_stage }}/db_install.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Run Oracle DB software-only silent installation
  when: not oracle_installed.stat.exists
  block:
    - name: Execute runInstaller
      ansible.builtin.command: >
        {{ oracle_home }}/runInstaller
        -silent
        -responseFile {{ installer_stage }}/db_install.rsp
        -ignorePrereqFailure
      environment:
        CV_ASSUME_DISTID: OEL8.5
      become: true
      become_user: "{{ oracle_user }}"
      register: db_install_result
      failed_when:
        - db_install_result.rc not in [0, 6]
        - '"Successfully Setup Software" not in db_install_result.stdout'
      changed_when: '"Successfully Setup Software" in db_install_result.stdout'
  rescue:
    - name: Find Oracle install log
      ansible.builtin.find:
        paths: /tmp
        patterns: "installActions*.log"
        recurse: true
        age: "-5m"
      register: install_logs

    - name: Show Oracle install log tail
      ansible.builtin.command: "tail -150 {{ (install_logs.files | sort(attribute='mtime') | last).path }}"
      register: log_tail
      when: install_logs.matched > 0

    - name: Display Oracle install log
      ansible.builtin.debug:
        msg: "{{ log_tail.stdout_lines }}"
      when: install_logs.matched > 0

    - name: Fail with install error
      ansible.builtin.fail:
        msg: "Oracle runInstaller failed (rc={{ db_install_result.rc }}). Log output shown above."

- name: Execute orainstRoot.sh (inventory registration)
  ansible.builtin.command: "{{ oracle_inventory }}/orainstRoot.sh"
  register: orainst_result
  changed_when: orainst_result.rc == 0
  when: not oracle_installed.stat.exists

- name: Execute root.sh (Oracle home root scripts)
  ansible.builtin.command: "{{ oracle_home }}/root.sh"
  register: root_result
  changed_when: root_result.rc == 0
  when: not oracle_installed.stat.exists

# root.sh normally sets SUID/execute bits on Oracle binaries.
# In stub/test environments root.sh is a no-op, leaving binaries without
# execute permissions.  Fix any files in bin/ that are missing the bit.
- name: Ensure Oracle home binaries are executable
  ansible.builtin.shell: |
    count=$(find "{{ oracle_home }}/bin" -maxdepth 1 -type f ! -perm /111 | wc -l)
    if [ "$count" -gt 0 ]; then
      find "{{ oracle_home }}/bin" -maxdepth 1 -type f ! -perm /111 -exec chmod 0755 {} +
      echo "fixed $count files"
    fi
  register: _bin_chmod
  changed_when: "'fixed' in _bin_chmod.stdout"
  failed_when: false
