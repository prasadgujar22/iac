---
# =============================================================================
# Oracle Database 19c software installation (silent)
# =============================================================================

- name: Copy Oracle DB installer to staging area
  ansible.builtin.copy:
    src: "{{ local_installer_src }}/{{ oracle_db_zip }}"
    dest: "{{ installer_stage }}/{{ oracle_db_zip }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when: oracle_db_zip != ''

- name: Unzip Oracle DB installer into ORACLE_HOME
  ansible.builtin.unarchive:
    src: "{{ installer_stage }}/{{ oracle_db_zip }}"
    dest: "{{ oracle_home }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    remote_src: true
    creates: "{{ oracle_home }}/runInstaller"

# bin/oracle ships inside the 19c zip, so it exists right after unzip.
# libclntshcore.so.19.1 is only created by a successful runInstaller.
- name: Check if Oracle software is already installed
  ansible.builtin.stat:
    path: "{{ oracle_home }}/lib/libclntshcore.so.19.1"
  register: oracle_installed

# Oracle 19.3 ins_rdbms.mk uses ORACLE_LINKLINE for shared library targets
# (libasmclntsh19.ohso etc.) and RDBMS_LINK_OPTS for other targets.
# Both need -Wl,--no-as-needed to work with binutils >= 2.35 (OL9).
- name: Patch ins_rdbms.mk ORACLE_LINKLINE for OL9/GCC11 compatibility
  ansible.builtin.replace:
    path: "{{ oracle_home }}/rdbms/lib/ins_rdbms.mk"
    regexp: '^(ORACLE_LINKLINE\s*=\s*)(.*)'
    replace: '\1\2 -Wl,--no-as-needed'
  become: true
  become_user: "{{ oracle_user }}"
  when: not oracle_installed.stat.exists

- name: Patch ins_rdbms.mk RDBMS_LINK_OPTS for OL9/GCC11 compatibility
  ansible.builtin.replace:
    path: "{{ oracle_home }}/rdbms/lib/ins_rdbms.mk"
    regexp: '^(RDBMS_LINK_OPTS\s*=\s*)(.*)'
    replace: '\1\2 -Wl,--no-as-needed'
  become: true
  become_user: "{{ oracle_user }}"
  when: not oracle_installed.stat.exists

# libasmperl19.so links against -lclntshcore and -lclntsh at build time.
# On OL9 the stubs in $ORACLE_HOME/lib/stubs/ are absent or invalid for
# the newer binutils, so the linker fails with "cannot find -lclntshcore".
# Create valid empty ELF stub SOs so the ASM library build can proceed.
- name: Create libclntshcore and libclntsh ELF stubs for ASM library build
  ansible.builtin.shell: |
    set -e
    for lib in libclntshcore libclntsh; do
      stub="{{ oracle_home }}/lib/stubs/${lib}.so"
      if [ ! -s "$stub" ] || ! file "$stub" | grep -q ELF; then
        printf 'void %s_stub(void) {}' "$lib" | \
          gcc -x c -shared -fPIC -o "$stub" -
      fi
    done
  become: true
  become_user: "{{ oracle_user }}"
  when: not oracle_installed.stat.exists
  changed_when: true

# genclntsh (Oracle client library builder) references /usr/lib64/libpthread_nonshared.a
# which was removed in glibc 2.34 (OL9). Create an empty static archive stub.
- name: Create libpthread_nonshared.a stub for Oracle genclntsh on OL9
  ansible.builtin.command: ar crs /usr/lib64/libpthread_nonshared.a
  args:
    creates: /usr/lib64/libpthread_nonshared.a

- name: Reset Oracle inventory from previous failed install
  ansible.builtin.file:
    path: "{{ oracle_inventory }}"
    state: "{{ item }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  loop:
    - absent
    - directory
  when: not oracle_installed.stat.exists

- name: Deploy Oracle DB silent response file
  ansible.builtin.template:
    src: db_install.rsp.j2
    dest: "{{ installer_stage }}/db_install.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Run Oracle DB software-only silent installation
  when: not oracle_installed.stat.exists
  block:
    - name: Execute runInstaller
      ansible.builtin.command: >
        {{ oracle_home }}/runInstaller
        -silent
        -responseFile {{ installer_stage }}/db_install.rsp
        -ignorePrereqFailure
      environment:
        CV_ASSUME_DISTID: OEL8.5
      become: true
      become_user: "{{ oracle_user }}"
      register: db_install_result
      failed_when:
        - db_install_result.rc not in [0, 6]
        - '"Successfully Setup Software" not in db_install_result.stdout'
      changed_when: '"Successfully Setup Software" in db_install_result.stdout'
  rescue:
    - name: Find Oracle install log
      ansible.builtin.find:
        paths: /tmp
        patterns: "installActions*.log"
        recurse: true
        age: "-5m"
      register: install_logs

    - name: Show Oracle install log tail
      ansible.builtin.command: "tail -150 {{ (install_logs.files | sort(attribute='mtime') | last).path }}"
      register: log_tail
      when: install_logs.matched > 0

    - name: Display Oracle install log
      ansible.builtin.debug:
        msg: "{{ log_tail.stdout_lines }}"
      when: install_logs.matched > 0

    - name: Fail with install error
      ansible.builtin.fail:
        msg: "Oracle runInstaller failed (rc={{ db_install_result.rc }}). Log output shown above."

- name: Execute orainstRoot.sh (inventory registration)
  ansible.builtin.command: "{{ oracle_inventory }}/orainstRoot.sh"
  register: orainst_result
  changed_when: orainst_result.rc == 0
  when: not oracle_installed.stat.exists

- name: Execute root.sh (Oracle home root scripts)
  ansible.builtin.command: "{{ oracle_home }}/root.sh"
  register: root_result
  changed_when: root_result.rc == 0
  when: not oracle_installed.stat.exists

# root.sh normally sets SUID/execute bits on Oracle binaries.
# In stub/test environments root.sh is a no-op, leaving binaries without
# execute permissions.  Fix any files in bin/ that are missing the bit.
- name: Ensure Oracle home binaries are executable
  ansible.builtin.shell: |
    count=$(find "{{ oracle_home }}/bin" -maxdepth 1 -type f ! -perm /111 | wc -l)
    if [ "$count" -gt 0 ]; then
      find "{{ oracle_home }}/bin" -maxdepth 1 -type f ! -perm /111 -exec chmod 0755 {} +
      echo "fixed $count files"
    fi
  register: _bin_chmod
  changed_when: "'fixed' in _bin_chmod.stdout"
  failed_when: false

# Oracle 19c (19.3) pre-compiled .a archives (libserver19.a, libjavavm19.a,
# libnnzst19.a) call stat() and fstat() as direct external symbols.  They were
# compiled on OEL7 (glibc 2.17) where those symbols lived in libc_nonshared.a
# as thin wrappers around __xstat()/__fxstat().  On OL9 (glibc 2.34),
# libc_nonshared.a no longer ships stat/fstat — they became real versioned
# functions in libc.so.6 (stat@GLIBC_2.33, fstat@GLIBC_2.33).  Oracle's orald
# link does not pull in any static library that provides the plain "stat" /
# "fstat" symbols, so the linker fails with "undefined reference to stat".
#
# Fix: compile a thin wrapper object that defines stat/fstat/lstat via the
# POSIX fstatat() call (available on any modern kernel + glibc), then inject
# it into libserver19.a via "ar -r" (which rebuilds the archive symbol-table
# index) so the linker finds the symbols when it processes that archive.
- name: Create stat/fstat compatibility source for Oracle 19c OL9 relinking
  ansible.builtin.copy:
    dest: "{{ oracle_home }}/rdbms/lib/stat_compat.c"
    content: |
      /* stat_compat.c — provide stat/fstat/lstat for Oracle 19c on OL9/x86-64.
       * Oracle pre-compiled .a files (libserver19.a etc.) call stat/fstat/lstat
       * as direct external symbols; glibc 2.34+ libc_nonshared.a no longer ships
       * them.  Raw x86-64 syscalls mean ZERO link-time deps beyond libc.so.6
       * (__errno_location), which the oracle binary already imports. */
      #include <sys/stat.h>
      #include <fcntl.h>
      #include <errno.h>
      /* x86-64 Linux syscall numbers */
      #define SC_FSTAT       5
      #define SC_NEWFSTATAT  262
      static long __fstat_sc(int fd, struct stat *buf)
      {
          long ret;
          __asm__ __volatile__(
              "syscall"
              : "=a"(ret)
              : "0"((long)SC_FSTAT), "D"((long)fd), "S"(buf)
              : "rdx", "rcx", "r11", "memory");
          return ret;
      }
      static long __newfstatat_sc(int dfd, const char *path,
                                   struct stat *buf, int flags)
      {
          long ret;
          register long r10 __asm__("r10") = (long)flags;
          __asm__ __volatile__(
              "syscall"
              : "=a"(ret)
              : "0"((long)SC_NEWFSTATAT), "D"((long)dfd),
                "S"(path), "d"(buf), "r"(r10)
              : "rcx", "r11", "memory");
          return ret;
      }
      /* POSIX wrappers: kernel returns -errno on error; convert to -1 + errno. */
      int stat(const char *p, struct stat *b)
      {
          long r = __newfstatat_sc(AT_FDCWD, p, b, 0);
          if (r < 0) { errno = (int)-r; return -1; }
          return 0;
      }
      int fstat(int f, struct stat *b)
      {
          long r = __fstat_sc(f, b);
          if (r < 0) { errno = (int)-r; return -1; }
          return 0;
      }
      int lstat(const char *p, struct stat *b)
      {
          long r = __newfstatat_sc(AT_FDCWD, p, b, AT_SYMLINK_NOFOLLOW);
          if (r < 0) { errno = (int)-r; return -1; }
          return 0;
      }
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  register: stat_compat_src

- name: Remove oracle binary to force relink when stat_compat.c changes
  ansible.builtin.file:
    path: "{{ oracle_home }}/bin/oracle"
    state: absent
  when: stat_compat_src.changed
  become: true
  become_user: "{{ oracle_user }}"
  register: oracle_binary_removed

- name: Compile stat/fstat compatibility object for Oracle 19c OL9 relinking
  # No 'creates:' — always recompile so a stale .o from a previous run is replaced.
  ansible.builtin.command:
    cmd: "gcc -O2 -c {{ oracle_home }}/rdbms/lib/stat_compat.c -o {{ oracle_home }}/rdbms/lib/stat_compat.o"
  changed_when: true

# Oracle 19c ships bin/oracle as a 0-byte placeholder in the ZIP.  A shell
# command like "oracle -help" always returns rc=0 on a 0-byte file because bash
# falls back to treating a non-ELF executable as a shell script (empty → exits
# 0).  execve() in bequeath mode has no such fallback: ENOEXEC closes the pipe
# and OCI returns ORA-12547.  Use "file | grep ELF" to reliably distinguish a
# real compiled binary from the unlinked placeholder.
- name: Check if oracle binary is a linked ELF executable
  ansible.builtin.shell: file "{{ oracle_home }}/bin/oracle" | grep -q "ELF"
  register: oracle_bin_check
  failed_when: false
  changed_when: false

- name: Relink Oracle binaries for Oracle Linux 9 compatibility
  # Use the dict/cmd form so Ansible does not run split_args on the multi-line
  # script (split_args chokes on double-quoted shell paths in free-form blocks).
  ansible.builtin.shell:
    cmd: |
      set -e
      export ORACLE_HOME="{{ oracle_home }}"
      export LD_LIBRARY_PATH=$ORACLE_HOME/lib:/lib:/usr/lib
      export PATH=$ORACLE_HOME/bin:$PATH
      ar -r $ORACLE_HOME/lib/libserver19.a $ORACLE_HOME/rdbms/lib/stat_compat.o
      cd $ORACLE_HOME/rdbms/lib
      rm -f $ORACLE_HOME/bin/oracle
      make -f ins_rdbms.mk ioracle
      cd $ORACLE_HOME/sqlplus/lib
      make -f ins_sqlplus.mk install
      cd $ORACLE_HOME/network/lib
      make -f ins_net_client.mk install
  become: true
  become_user: "{{ oracle_user }}"
  when: not oracle_installed.stat.exists or oracle_bin_check.rc != 0 or (oracle_binary_removed.changed | default(false))
  register: relink_result
  changed_when: true

- name: Show relink output (for diagnosis if subsequent steps fail)
  ansible.builtin.debug:
    msg: "{{ (relink_result.stdout_lines | default([])) + (relink_result.stderr_lines | default([])) }}"
  when: relink_result is not skipped

# Register oracle_home/lib with the system dynamic linker so the oracle server
# process can find its shared libraries without LD_LIBRARY_PATH being set.
# This is critical on OL9: when DBCA forks oracle for its OS-auth pre-flight
# check, LD_LIBRARY_PATH is not inherited, causing oracle to crash (ORA-12547).
- name: Register Oracle home lib in system linker config
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/oracle-19c.conf
    content: "{{ oracle_home }}/lib\n"
    mode: "0644"

- name: Run ldconfig to update shared library cache
  ansible.builtin.command: ldconfig
  changed_when: true

# Container environments (Docker/Podman) commonly set PR_SET_NO_NEW_PRIVS=1
# (NoNewPrivs) or mount the rootfs with nosuid, which silently strips SUID
# when exec()ing an SUID binary.  Oracle's bequeath (local IPC) connection
# forks+execs the oracle binary; if the exec gets the wrong effective UID the
# bequeath fd handshake (ORA_NET2_DESC) fails → ORA-12547 → DBT-05509.
# Since every Ansible task that needs oracle runs as oracle (become_user),
# SUID is not required: the binary already runs as the correct user.
- name: Ensure oracle binary is executable (no SUID needed when running as oracle)
  ansible.builtin.file:
    path: "{{ oracle_home }}/bin/oracle"
    mode: "0751"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
