---
# =============================================================================
# Configure and start Oracle Net Listener
# =============================================================================

# Deploy sqlnet.ora first so OS authentication is enabled when DBCA runs.
# The Oracle home zip ships with SQLNET.AUTHENTICATION_SERVICES=(NONE) which
# disables OS auth; that causes DBCA's internal connection check to fail with
# [DBT-05509] ("OS Authentication might be disabled").
# Deploy to both ORACLE_HOME and ORACLE_BASE network/admin paths because
# Oracle 19c may resolve config from either location depending on environment.
- name: Ensure oracle_base network/admin directory exists
  ansible.builtin.file:
    path: "{{ oracle_base }}/network/admin"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"

- name: Deploy sqlnet.ora (enable OS authentication) to ORACLE_HOME
  ansible.builtin.copy:
    dest: "{{ oracle_home }}/network/admin/sqlnet.ora"
    content: |
      SQLNET.AUTHENTICATION_SERVICES = (ALL)
      NAMES.DIRECTORY_PATH = (TNSNAMES, EZCONNECT)
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"

- name: Deploy sqlnet.ora (enable OS authentication) to ORACLE_BASE
  ansible.builtin.copy:
    dest: "{{ oracle_base }}/network/admin/sqlnet.ora"
    content: |
      SQLNET.AUTHENTICATION_SERVICES = (ALL)
      NAMES.DIRECTORY_PATH = (TNSNAMES, EZCONNECT)
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"

- name: Deploy listener.ora
  ansible.builtin.template:
    src: listener.ora.j2
    dest: "{{ oracle_home }}/network/admin/listener.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"

- name: Deploy tnsnames.ora
  ansible.builtin.template:
    src: tnsnames.ora.j2
    dest: "{{ oracle_home }}/network/admin/tnsnames.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"

- name: Start Oracle Listener
  ansible.builtin.shell: "{{ oracle_home }}/bin/lsnrctl start {{ listener_name }}"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_env.PATH }}"
    LD_LIBRARY_PATH: "{{ oracle_home }}/lib:/lib:/usr/lib"
  register: listener_start
  failed_when:
    - listener_start.rc != 0
    - '"TNS-01106" not in listener_start.stderr'  # already running
  changed_when: '"The command completed successfully" in listener_start.stdout'

- name: Deploy listener systemd service
  ansible.builtin.template:
    src: oracle-listener.service.j2
    dest: /etc/systemd/system/oracle-listener.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart oracle listener

- name: Enable Oracle Listener service
  ansible.builtin.systemd:
    name: oracle-listener
    enabled: true
    daemon_reload: true
