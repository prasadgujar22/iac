---
# =============================================================================
# Create Oracle 19c database using DBCA (silent)
# =============================================================================

- name: Deploy DBCA silent response file
  ansible.builtin.template:
    src: dbca.rsp.j2
    dest: "{{ installer_stage }}/dbca.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Check if database already exists
  ansible.builtin.stat:
    path: "{{ oracle_home }}/dbs/spfile{{ oracle_db_name }}.ora"
  register: oracle_spfile

- name: Run DBCA to create the database
  ansible.builtin.command: >
    {{ oracle_home }}/bin/dbca
    -silent
    -createDatabase
    -responseFile {{ installer_stage }}/dbca.rsp
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_BASE: "{{ oracle_base }}"
    LD_LIBRARY_PATH: "{{ oracle_home }}/lib:/lib:/usr/lib"
    CV_ASSUME_DISTID: "OEL8.5"
  register: dbca_result
  failed_when:
    - dbca_result.rc != 0
    - '"Database creation complete" not in dbca_result.stdout'
  changed_when: '"Database creation complete" in dbca_result.stdout'
  when: not oracle_spfile.stat.exists

- name: Enable Oracle DB autostart on boot
  ansible.builtin.lineinfile:
    path: /etc/oratab
    regexp: "^{{ oracle_db_name }}:"
    line: "{{ oracle_db_name }}:{{ oracle_home }}:Y"
  notify: restart oracle db

- name: Deploy oracle systemd service
  ansible.builtin.template:
    src: oracle-db.service.j2
    dest: /etc/systemd/system/oracle-db.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart oracle db

- name: Enable Oracle DB service at boot
  ansible.builtin.systemd:
    name: oracle-db
    enabled: true
    daemon_reload: true
