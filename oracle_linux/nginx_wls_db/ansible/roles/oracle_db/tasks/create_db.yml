---
# =============================================================================
# Create Oracle 19c database using DBCA (silent)
# =============================================================================

- name: Deploy DBCA silent response file
  ansible.builtin.template:
    src: dbca.rsp.j2
    dest: "{{ installer_stage }}/dbca.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Check if database already exists
  ansible.builtin.stat:
    path: "{{ oracle_home }}/dbs/spfile{{ oracle_db_name }}.ora"
  register: oracle_spfile

- name: Ensure Oracle inventory pointer file exists (/etc/oraInst.loc)
  ansible.builtin.copy:
    dest: /etc/oraInst.loc
    content: |
      inventory_loc={{ oracle_inventory }}
      inst_group={{ oracle_group }}
    mode: "0644"
    force: false
  when: not oracle_spfile.stat.exists

- name: Ensure Oracle inventory ContentsXML directory exists
  ansible.builtin.file:
    path: "{{ oracle_inventory }}/ContentsXML"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0770"
  when: not oracle_spfile.stat.exists

- name: Ensure Oracle inventory.xml has registered home
  ansible.builtin.copy:
    dest: "{{ oracle_inventory }}/ContentsXML/inventory.xml"
    content: |
      <?xml version="1.0" standalone="yes" ?>
      <INVENTORY>
      <VERSION_INFO>
         <SAVED_WITH>12.2.0.1.0</SAVED_WITH>
         <MINIMUM_VER>2.1.0.6.0</MINIMUM_VER>
      </VERSION_INFO>
      <HOME_LIST>
      <HOME NAME="OraDB19Home1" LOC="{{ oracle_home }}" TYPE="O" IDX="1"/>
      </HOME_LIST>
      <COMPOSITEHOME_LIST>
      </COMPOSITEHOME_LIST>
      </INVENTORY>
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0664"
    force: false
  when: not oracle_spfile.stat.exists

- name: Ensure Oracle dbs directory exists
  ansible.builtin.file:
    path: "{{ oracle_home }}/dbs"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  when: not oracle_spfile.stat.exists

- name: Ensure DBCA templates directory exists
  ansible.builtin.file:
    path: "{{ oracle_home }}/assistants/dbca/templates"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  when: not oracle_spfile.stat.exists

- name: Create General_Purpose.dbc template stub for DBCA
  ansible.builtin.copy:
    dest: "{{ oracle_home }}/assistants/dbca/templates/General_Purpose.dbc"
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <DatabaseTemplate name="General_Purpose" description="General Purpose" version="19.0.0.0.0">
      </DatabaseTemplate>
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
    force: false
  when: not oracle_spfile.stat.exists

# Clean up all Oracle instance artifacts that DBCA inspects to decide whether
# a database already exists.  If a previous DBCA run failed mid-flight it can
# leave behind initSID.ora, orapwSID, lock-files, and IPC sockets; the next
# DBCA invocation finds them, tries an OS-auth connection, and fails [DBT-05509].
# oracle_base/dbs/ is also checked because ORACLE_BASE_CONFIG causes Oracle 19c
# read-only home mode to use that path instead of oracle_home/dbs/.
- name: Remove stale Oracle instance artifacts before database creation
  ansible.builtin.shell: |
    # Kill ALL oracle processes for this SID: background procs (ora_pmon_WLSDB etc)
    # AND oracle server processes from bequeath connections (process name includes SID).
    # The previous run may have left a full 2.4 GB SGA with nattch=9; we must kill
    # everything so the SHM segments drop to nattch=0 before ipcrm runs below.
    pkill -9 -u {{ oracle_user }} -f "{{ oracle_db_name }}" || true
    pkill -9 -u {{ oracle_user }} -f "ora_" || true
    sleep 5
    rm -f /dev/shm/*{{ oracle_db_name }}* 2>/dev/null || true
    rm -rf "{{ oracle_base }}/admin/{{ oracle_db_name }}"
    rm -rf "{{ oracle_base }}/admin/{{ oracle_db_name | lower }}"
    rm -rf "{{ oracle_base }}/audit/{{ oracle_db_name }}"
    rm -rf "{{ oracle_base }}/audit/{{ oracle_db_name | lower }}"
    rm -rf "{{ oracle_base }}/cfgtoollogs/dbca/{{ oracle_db_name }}"
    rm -rf "{{ oracle_base }}/cfgtoollogs/dbca/{{ oracle_db_name | lower }}"
    rm -rf "{{ oracle_base }}/diag/rdbms/{{ oracle_db_name | lower }}"
    rm -rf "{{ oracle_base }}/oradata/{{ oracle_db_name }}"
    rm -rf "{{ oracle_base }}/oradata/{{ oracle_db_name | upper }}"
    rm -rf "{{ oracle_base }}/fast_recovery_area/{{ oracle_db_name }}"
    rm -rf "{{ oracle_base }}/fast_recovery_area/{{ oracle_db_name | upper }}"
    # oracle_fra_dir may be a separate tmpfs/mount (not under oracle_base); delete explicitly
    rm -rf "{{ oracle_fra_dir }}/{{ oracle_db_name }}"
    rm -rf "{{ oracle_fra_dir }}/{{ oracle_db_name | upper }}"
    # oracle_data_dir likewise may be a separate mount; delete SID subdir explicitly
    rm -rf "{{ oracle_data_dir }}/{{ oracle_db_name }}"
    rm -rf "{{ oracle_data_dir }}/{{ oracle_db_name | upper }}"
    rm -f "{{ oracle_home }}/dbs/init{{ oracle_db_name }}.ora"
    rm -f "{{ oracle_home }}/dbs/orapw{{ oracle_db_name }}"
    rm -f "{{ oracle_home }}/dbs/lk{{ oracle_db_name | upper }}"
    rm -f "{{ oracle_home }}/dbs/hc_{{ oracle_db_name }}.dat"
    rm -f "{{ oracle_base }}/dbs/init{{ oracle_db_name }}.ora"
    rm -f "{{ oracle_base }}/dbs/orapw{{ oracle_db_name }}"
    rm -f "{{ oracle_base }}/dbs/lk{{ oracle_db_name | upper }}"
    rm -f "{{ oracle_base }}/dbs/hc_{{ oracle_db_name }}.dat"
    rm -rf "{{ oracle_base }}/admin/{{ oracle_db_name }}"
    rm -rf "{{ oracle_base }}/cfgtoollogs/dbca/{{ oracle_db_name }}"
    rm -rf "{{ oracle_base }}/diag/rdbms/{{ oracle_db_name | lower }}"
    rm -f /var/tmp/.oracle/*{{ oracle_db_name }}* 2>/dev/null || true
    rm -f /tmp/.oracle/*{{ oracle_db_name }}* 2>/dev/null || true
    mv -f {{ oracle_home }}/dbs/init.ora {{ oracle_home }}/dbs/init.ora.template 2>/dev/null || true
    ipcs -m | grep oracle | awk '{print $2}' | xargs -r ipcrm -m 2>/dev/null || true
    ipcs -s | grep oracle | awk '{print $2}' | xargs -r ipcrm -s 2>/dev/null || true
  when: not oracle_spfile.stat.exists
  changed_when: false
  failed_when: false

- name: Remove stale oratab entry if database was not fully created
  ansible.builtin.lineinfile:
    path: /etc/oratab
    regexp: "^(?i){{ oracle_db_name }}:"
    state: absent
  when: not oracle_spfile.stat.exists
  failed_when: false

# Oracle 19c on OL9: without an init file, oracle exits with ORA-01078 BEFORE
# completing the TNS handshake, so the bequeath client sees ORA-12547 instead.
# DBCA maps any bequeath ORA-12547 → DBT-05509 and aborts.  Providing a
# minimal init file lets oracle reach NOMOUNT and complete the handshake;
# DBCA then sees "instance in NOMOUNT state → no database yet → proceed with
# creation".  DBCA overwrites this stub with a real spfile during creation.
- name: Create minimal init file so oracle can complete bequeath TNS handshake
  ansible.builtin.copy:
    dest: "{{ oracle_home }}/dbs/init{{ oracle_db_name }}.ora"
    content: |
      db_name={{ oracle_db_name }}
      use_large_pages=FALSE
      sga_target=256m
      pga_aggregate_target=64m
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
  when: not oracle_spfile.stat.exists

# DBCA pre-flight connects via bequeath to check whether the DB exists.
# Oracle 19c attempts to write an audit record on each SYSDBA connect.
# If audit_trail=OS (or unified auditing writes to adump), oracle raises
# ORA-09925 "Unable to create audit trail file" when adump is missing,
# which causes DBCA to map the connect failure to DBT-05509 and abort.
# The cleanup task above deletes oracle_base/admin/WLSDB entirely; we
# must recreate adump here so the bequeath pre-flight can proceed.
- name: Create Oracle audit directory (prevents ORA-09925 on bequeath pre-flight)
  ansible.builtin.file:
    path: "{{ oracle_base }}/admin/{{ oracle_db_name }}/adump"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"
  when: not oracle_spfile.stat.exists

# Ensure oracle binary does NOT have SUID/SGID set.  Container runtimes with
# NoNewPrivs (--security-opt=no-new-privileges) or nosuid mounts silently
# strip setuid bits at exec() time; the resulting effective-UID mismatch
# corrupts oracle's bequeath fd setup → ORA-12547 / DBT-05509.
# We always invoke oracle as oracle (become_user), so SUID is unnecessary.
- name: Ensure oracle binary is executable without SUID (NoNewPrivs-safe)
  ansible.builtin.file:
    path: "{{ oracle_home }}/bin/oracle"
    mode: "0751"
    owner: "{{ oracle_user }}"
    group: "dba"
  become: true
  when: not oracle_spfile.stat.exists

# "oracle -help" is not a reliable check: bash silently falls back to running
# a 0-byte (unlinked) oracle as an empty shell script, which exits 0.  OCI's
# bequeath execve() has no such fallback (returns ENOEXEC → ORA-12547).
# Verify with "file | grep ELF" so a 0-byte placeholder is caught here and
# not blamed on a bequeath/environment issue.
- name: Validate that Oracle binary is a linked ELF executable
  ansible.builtin.shell: |
    out=$(file "{{ oracle_home }}/bin/oracle" 2>&1)
    echo "$out"
    echo "$out" | grep -q "ELF"
  register: oracle_bin_check
  failed_when: oracle_bin_check.rc != 0
  changed_when: false
  when: not oracle_spfile.stat.exists

- name: Run DBCA to create the database (with log diagnostics)
  when: not oracle_spfile.stat.exists
  block:
    - name: Run DBCA command
      ansible.builtin.shell:
        # Raise open-file limit to 65536 before launching DBCA — the
        # New_Database.dbt template installs catalog/catproc SQL scripts
        # which open hundreds of files; the default PAM soft limit (1024)
        # is too low and causes catalog.sql to hang or fail.
        # timeout 2700 (45 min) prevents an indefinite hang if DBCA waits
        # for a listener that isn't running yet.
        cmd: |
          ulimit -n 65536
          timeout 2700 {{ oracle_home }}/bin/dbca \
            -silent \
            -createDatabase \
            -responseFile {{ installer_stage }}/dbca.rsp \
            -ignorePrereqFailure \
            '-J-Djava.security.egd=file:///dev/urandom' \
            -sysPassword '{{ oracle_sys_password }}' \
            -systemPassword '{{ oracle_system_password }}'
      become: true
      become_user: "{{ oracle_user }}"
      environment:
        ORACLE_HOME: "{{ oracle_home }}"
        ORACLE_BASE: "{{ oracle_base }}"
        # ORACLE_SID is set so DBCA knows which instance to bequeath-connect to
        # for its "DB already exists?" pre-flight check.  With the SUID bit
        # removed (NoNewPrivs-safe), bequeath works correctly: oracle starts to
        # NOMOUNT using the stub init file, DBCA sees the instance in NOMOUNT
        # state (= no existing DB), and proceeds with creation.
        ORACLE_SID: "{{ oracle_db_name }}"
        ORACLE_HOSTNAME: "{{ ansible_facts['hostname'] }}"
        TNS_ADMIN: "{{ oracle_home }}/network/admin"
        PATH: "{{ oracle_home }}/bin:{{ ansible_facts['env']['PATH'] }}"
        LD_LIBRARY_PATH: "{{ oracle_home }}/lib:/lib:/usr/lib"
        CV_ASSUME_DISTID: "OEL8.5"
        # glibc 2.34+ (OL9) default multi-arena malloc causes oracle server
        # processes forked via bequeath to crash (SIGSEGV/SIGABRT), returning
        # ORA-12547 to the caller.  Single-arena mode avoids the crash.
        MALLOC_ARENA_MAX: "1"
      register: dbca_result
      failed_when:
        - dbca_result.rc != 0
        - '"Database creation complete" not in dbca_result.stdout'
      changed_when: '"Database creation complete" in dbca_result.stdout'

  rescue:
    - name: Gather DBCA Diagnostics
      ansible.builtin.shell: |
        echo "=== Container security (NoNewPrivs / Seccomp / nosuid) ==="
        grep -E "NoNewPriv|Seccomp" /proc/self/status 2>/dev/null || echo "not available"
        mount 2>/dev/null | grep -E "nosuid|noexec" | head -5 || true
        echo "=== oracle binary mode and type ==="
        ls -la {{ oracle_home }}/bin/oracle
        file {{ oracle_home }}/bin/oracle || true
        echo "=== /etc/oratab ==="
        cat /etc/oratab || true
        echo "=== /dev/shm ==="
        df -h /dev/shm
        echo "=== Processes ==="
        ps -ef | grep pmon || true
        echo "=== ORACLE_HOME/dbs ==="
        ls -la {{ oracle_home }}/dbs || true
        echo "=== Oracle binary ldd ==="
        ldd {{ oracle_home }}/bin/oracle 2>&1 | grep -i "not found" || echo "all libs found"
        echo "=== libcrypt.so.1 (OL9 requires libxcrypt-compat) ==="
        ls -la /usr/lib64/libcrypt.so.1 2>&1 || echo "MISSING: libcrypt.so.1 not found - install libxcrypt-compat"
        rpm -q libxcrypt-compat 2>&1 || echo "libxcrypt-compat not installed"
        echo "=== libclntsh transitive deps ==="
        ldd {{ oracle_home }}/lib/libclntsh.so.19.1 2>&1 | grep -i "not found" || echo "all libclntsh deps found"
        echo "=== SELinux status ==="
        getenforce 2>/dev/null || echo "selinux not available"
        echo "=== dbs directory ==="
        ls -la {{ oracle_home }}/dbs/ || true
        echo "=== sqlnet.ora ==="
        cat {{ oracle_home }}/network/admin/sqlnet.ora 2>/dev/null || echo "not found"
        echo "=== SysV IPC (stale oracle segments cause ORA-12547) ==="
        ipcs -m 2>&1 || true
        ipcs -s 2>&1 || true
        echo "=== ulimit -a (PAM limits may not be applied via sudo become) ==="
        ulimit -a
        echo "=== /proc/self/limits ==="
        cat /proc/self/limits
        echo "=== dmesg tail (segfault/OOM/kill checks) ==="
        dmesg 2>/dev/null | tail -20 || true
        echo "=== oracle standalone test (exit=124 means hang/OK; >128 means crash signal) ==="
        timeout 2 {{ oracle_home }}/bin/oracle 2>&1 | head -3 || true
        echo "oracle standalone exit: $?"
        echo "=== sqlplus bequeath probe (expect ORA-01078 if no instance) ==="
        echo 'exit' | {{ oracle_home }}/bin/sqlplus -s / as sysdba 2>&1 | head -5 || true
        echo "=== sqlplus bequeath probe with raised ulimits ==="
        ( ulimit -n 65536; ulimit -u unlimited; ulimit -s unlimited
          echo 'exit' | {{ oracle_home }}/bin/sqlplus -s / as sysdba 2>&1 | head -5 ) || true
        echo "=== oracle standalone proper exit code ==="
        timeout 2 {{ oracle_home }}/bin/oracle > /tmp/ora_sa.txt 2>&1
        echo "standalone exit: $? (124=hung/OK; 139=SIGSEGV; 0=clean)"
        head -2 /tmp/ora_sa.txt 2>/dev/null || true; rm -f /tmp/ora_sa.txt
        echo "=== ldcache for oracle libs ==="
        ldconfig -p 2>/dev/null | grep -E "libclntsh|libnnz" | head -5 || echo "not in ldcache"
        echo "=== sqlplus bequeath probe (should show ORA-01034/ORA-27101, NOT ORA-12547) ==="
        echo 'exit' | {{ oracle_home }}/bin/sqlplus -s / as sysdba 2>&1 | head -5 || true
        echo "=== oracle_data_dir mount and contents ==="
        df -h {{ oracle_data_dir }} 2>/dev/null || echo "oracle_data_dir df failed"
        ls -la {{ oracle_data_dir }}/ 2>/dev/null || echo "oracle_data_dir not found or empty"
        ls -la {{ oracle_data_dir }}/{{ oracle_db_name }}/ 2>/dev/null || echo "WLSDB subdir not found"
        echo "=== oracle_fra_dir mount and contents ==="
        df -h {{ oracle_fra_dir }} 2>/dev/null || echo "oracle_fra_dir df failed"
        ls -la {{ oracle_fra_dir }}/ 2>/dev/null || echo "oracle_fra_dir not found or empty"
        echo "=== rendered dbca.rsp datafile/destination settings ==="
        grep -E "(datafile|Destination|Jar|template|createAs|numberOfPDB)" {{ installer_stage }}/dbca.rsp 2>/dev/null || echo "dbca.rsp not found"
        echo "=== DBCA templates directory ==="
        ls -la {{ oracle_home }}/assistants/dbca/templates/ 2>/dev/null | head -20 || echo "templates dir not found"
        echo "=== DBCA Logs ==="
        find {{ oracle_base }}/cfgtoollogs {{ oracle_home }}/cfgtoollogs /tmp /var/tmp -maxdepth 5 -type f -name "*.log" -mmin -10 -exec echo "--- {} ---" \; -exec tail -n 100 {} \; 2>/dev/null || true
        echo "=== Oracle trace files ==="
        find {{ oracle_base }}/diag -maxdepth 5 -type f -name "*.trc" -mmin -10 -exec echo "--- {} ---" \; -exec tail -n 30 {} \; 2>/dev/null || true
      register: dbca_diags
      failed_when: false
      changed_when: false
      become: true
      become_user: "{{ oracle_user }}"
      environment:
        ORACLE_HOME: "{{ oracle_home }}"
        ORACLE_SID: "{{ oracle_db_name }}"
        ORACLE_BASE: "{{ oracle_base }}"
        PATH: "{{ oracle_home }}/bin:{{ ansible_facts['env']['PATH'] }}"
        LD_LIBRARY_PATH: "{{ oracle_home }}/lib:/lib:/usr/lib"
        MALLOC_ARENA_MAX: "1"

    - name: Display DBCA Diagnostics
      ansible.builtin.debug:
        msg: "{{ dbca_diags.stdout_lines }}"

    - name: Fail the playbook
      ansible.builtin.fail:
        msg: "DBCA Failed. See logs above for the underlying ORA- error."

- name: Restore generic init.ora template (renamed before DBCA to prevent pre-flight confusion)
  ansible.builtin.shell: >
    mv -f "{{ oracle_home }}/dbs/init.ora.template"
           "{{ oracle_home }}/dbs/init.ora" 2>/dev/null || true
  changed_when: false
  failed_when: false

- name: Enable Oracle DB autostart on boot
  ansible.builtin.lineinfile:
    path: /etc/oratab
    regexp: "^{{ oracle_db_name }}:"
    line: "{{ oracle_db_name }}:{{ oracle_home }}:Y"
    create: true
    owner: oracle
    group: oinstall
    mode: "0644"
  notify: restart oracle db

- name: Deploy oracle systemd service
  ansible.builtin.template:
    src: oracle-db.service.j2
    dest: /etc/systemd/system/oracle-db.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart oracle db

- name: Enable Oracle DB service at boot
  ansible.builtin.systemd:
    name: oracle-db
    enabled: true
    daemon_reload: true
