---
# =============================================================================
# Oracle DB OS prerequisites
# =============================================================================

- name: Install oracle-database-preinstall-19c package
  ansible.builtin.dnf:
    name: oracle-database-preinstall-19c
    state: present
    enablerepo: ol9_baseos_latest,ol9_appstream

- name: Install additional Oracle dependency packages
  ansible.builtin.dnf:
    name:
      - bc
      - binutils
      - compat-openssl11
      - elfutils-libelf
      - fontconfig
      - glibc
      - glibc-devel
      - ksh
      - libaio
      - libaio-devel
      - libgcc
      - libnsl
      - libstdc++
      - libstdc++-devel
      - libXi
      - libXtst
      - make
      - smartmontools
      - sysstat
      - unzip
    state: present

- name: Create Oracle groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - oinstall
    - dba
    - oper
    - backupdba
    - dgdba
    - kmdba
    - racdba

- name: Create oracle OS user
  ansible.builtin.user:
    name: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    groups: dba,oper,backupdba,dgdba,kmdba,racdba
    home: /home/{{ oracle_user }}
    shell: /bin/bash
    createhome: true
    state: present

- name: Create Oracle base and inventory directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  loop:
    - "{{ oracle_base }}"
    - "{{ oracle_inventory }}"
    - "{{ oracle_home }}"
    - "{{ installer_stage }}"

- name: Set Oracle kernel parameters (sysctl)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { key: kernel.shmmax,        value: "4398046511104" }
    - { key: kernel.shmall,        value: "1073741824" }
    - { key: kernel.shmmni,        value: "4096" }
    - { key: kernel.sem,           value: "250 32000 100 128" }
    - { key: fs.file-max,          value: "6815744" }
    - { key: fs.aio-max-nr,        value: "1048576" }
    - { key: net.ipv4.ip_local_port_range, value: "9000 65500" }
    - { key: net.core.rmem_default, value: "262144" }
    - { key: net.core.rmem_max,    value: "4194304" }
    - { key: net.core.wmem_default, value: "262144" }
    - { key: net.core.wmem_max,    value: "1048576" }
    - { key: vm.swappiness,        value: "10" }
    - { key: vm.dirty_background_ratio, value: "3" }
    - { key: vm.dirty_ratio,       value: "80" }

- name: Set Oracle resource limits
  ansible.builtin.blockinfile:
    path: /etc/security/limits.d/99-oracle.conf
    create: true
    marker: "# {mark} ANSIBLE MANAGED – Oracle limits"
    block: |
      oracle   soft   nofile    1024
      oracle   hard   nofile    65536
      oracle   soft   nproc     16384
      oracle   hard   nproc     16384
      oracle   soft   stack     10240
      oracle   hard   stack     32768
      oracle   soft   memlock   134217728
      oracle   hard   memlock   134217728

- name: Set oracle user environment (~/.bash_profile)
  ansible.builtin.blockinfile:
    path: /home/{{ oracle_user }}/.bash_profile
    create: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    marker: "# {mark} ANSIBLE MANAGED – Oracle environment"
    block: |
      export ORACLE_BASE={{ oracle_base }}
      export ORACLE_HOME={{ oracle_home }}
      export ORACLE_SID={{ oracle_db_name }}
      export PATH=$ORACLE_HOME/bin:$PATH
      export LD_LIBRARY_PATH=$ORACLE_HOME/lib:/lib:/usr/lib
      export CLASSPATH=$ORACLE_HOME/jlib:$ORACLE_HOME/rdbms/jlib
      export NLS_DATE_FORMAT="DD-MON-YYYY HH24:MI:SS"

- name: Open Oracle listener port in firewalld
  ansible.posix.firewalld:
    port: "{{ listener_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
