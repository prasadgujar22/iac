---
# =============================================================================
# Prepare dedicated disks for Oracle datafiles and FRA
# scsi1 (/dev/sdb) → /u01/oradata
# scsi2 (/dev/sdc) → /u01/fra
#
# Disk states handled:
#   1. Fresh unpartitioned disk (no filesystem)     → wipefs + mkfs.xfs -L
#   2. Partitioned disk, XFS, no label              → xfs_admin -L
#   3. Partitioned disk, ext4, no label             → e2label
#   4. Any disk already labelled correctly          → no-op
# =============================================================================

- name: Ensure ORADATA label is set on Oracle data disk
  ansible.builtin.shell: |
    set -e
    if blkid -L ORADATA > /dev/null 2>&1; then
      echo "already_labelled"
      exit 0
    fi
    dev="{{ oracle_data_disk }}1"
    [ -b "$dev" ] || dev="{{ oracle_data_disk }}"
    fstype=$(blkid -o value -s TYPE "$dev" 2>/dev/null || true)
    case "$fstype" in
      xfs)
        xfs_admin -L ORADATA "$dev"
        ;;
      ext2|ext3|ext4)
        e2label "$dev" ORADATA
        ;;
      "")
        wipefs -a "{{ oracle_data_disk }}"
        mkfs.xfs -L ORADATA -f "{{ oracle_data_disk }}"
        ;;
      *)
        echo "Unsupported filesystem type: $fstype" >&2; exit 1
        ;;
    esac
    udevadm trigger --action=change "$dev"
    udevadm settle
  register: data_disk_setup
  changed_when: "'already_labelled' not in data_disk_setup.stdout"

- name: Ensure ORAFRA label is set on FRA disk
  ansible.builtin.shell: |
    set -e
    if blkid -L ORAFRA > /dev/null 2>&1; then
      echo "already_labelled"
      exit 0
    fi
    dev="{{ oracle_fra_disk }}1"
    [ -b "$dev" ] || dev="{{ oracle_fra_disk }}"
    fstype=$(blkid -o value -s TYPE "$dev" 2>/dev/null || true)
    case "$fstype" in
      xfs)
        xfs_admin -L ORAFRA "$dev"
        ;;
      ext2|ext3|ext4)
        e2label "$dev" ORAFRA
        ;;
      "")
        wipefs -a "{{ oracle_fra_disk }}"
        mkfs.xfs -L ORAFRA -f "{{ oracle_fra_disk }}"
        ;;
      *)
        echo "Unsupported filesystem type: $fstype" >&2; exit 1
        ;;
    esac
    udevadm trigger --action=change "$dev"
    udevadm settle
  register: fra_disk_setup
  changed_when: "'already_labelled' not in fra_disk_setup.stdout"

- name: Create mount point directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  loop:
    - "{{ oracle_data_dir }}"
    - "{{ oracle_fra_dir }}"

- name: Mount Oracle data disk persistently
  ansible.posix.mount:
    path: "{{ oracle_data_dir }}"
    src: "LABEL=ORADATA"
    fstype: auto
    opts: defaults,noatime
    state: mounted

- name: Mount FRA disk persistently
  ansible.posix.mount:
    path: "{{ oracle_fra_dir }}"
    src: "LABEL=ORAFRA"
    fstype: auto
    opts: defaults,noatime
    state: mounted

- name: Set ownership of mount points after mounting
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
    recurse: false
  loop:
    - "{{ oracle_data_dir }}"
    - "{{ oracle_fra_dir }}"
