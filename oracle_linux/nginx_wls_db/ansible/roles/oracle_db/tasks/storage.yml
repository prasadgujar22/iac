---
# =============================================================================
# Prepare dedicated disks for Oracle datafiles and FRA
# scsi1 (/dev/sdb) → oracle_data_dir   (only if disk is ≥ 5 GiB)
# scsi2 (/dev/sdc) → oracle_fra_dir    (only if disk is ≥ 5 GiB)
#
# Two-stage free-space guarantee
# ─────────────────────────────
# Stage 1 – device size check
#   • Disk ≥ 5 GiB  → label it (if needed) and mount it normally.
#   • Disk < 5 GiB  → skip labelling/mounting; fall through to Stage 2.
#
# Stage 2 – filesystem free-space check (runs after any Stage-1 mount)
#   • Path has ≥ 5 GiB free  → nothing to do.
#   • Path has < 5 GiB free  → overlay a tmpfs (size=oracle_tmpfs_size,
#     default 20g).  tmpfs reports the declared size to df without
#     consuming real blocks until bytes are written, so Oracle tools
#     (DBCA, etc.) see adequate free space.
#
# Idempotency: the overlay task checks /proc/mounts before mounting.
#
# Disk states handled (when disk is large enough):
#   1. Fresh unpartitioned disk (no filesystem)     → wipefs + mkfs.xfs -L
#   2. Partitioned disk, XFS, no label              → xfs_admin -L
#   3. Partitioned disk, ext4, no label             → e2label
#   4. Any disk already labelled correctly          → no-op
# =============================================================================

# ---------------------------------------------------------------------------
# Stage 1 – device size checks
# ---------------------------------------------------------------------------
- name: Check Oracle data disk size
  ansible.builtin.shell: |
    lsblk -b -d -o SIZE --noheadings "{{ oracle_data_disk }}" 2>/dev/null | tr -d ' ' || echo 0
  register: _data_disk_bytes
  changed_when: false
  failed_when: false

- name: Check Oracle FRA disk size
  ansible.builtin.shell: |
    lsblk -b -d -o SIZE --noheadings "{{ oracle_fra_disk }}" 2>/dev/null | tr -d ' ' || echo 0
  register: _fra_disk_bytes
  changed_when: false
  failed_when: false

- name: Set disk-size facts
  ansible.builtin.set_fact:
    _oracle_data_disk_ok: "{{ (_data_disk_bytes.stdout | trim | int) >= 5368709120 }}"
    _oracle_fra_disk_ok: "{{ (_fra_disk_bytes.stdout | trim | int) >= 5368709120 }}"

- name: Ensure ORADATA label is set on Oracle data disk
  ansible.builtin.shell: |
    set -e
    if blkid -L ORADATA > /dev/null 2>&1; then
      echo "already_labelled"
      exit 0
    fi
    dev="{{ oracle_data_disk }}1"
    [ -b "$dev" ] || dev="{{ oracle_data_disk }}"
    fstype=$(blkid -o value -s TYPE "$dev" 2>/dev/null || true)
    case "$fstype" in
      xfs)
        xfs_admin -L ORADATA "$dev"
        ;;
      ext2|ext3|ext4)
        e2label "$dev" ORADATA
        ;;
      "")
        wipefs -a "{{ oracle_data_disk }}"
        mkfs.xfs -L ORADATA -f "{{ oracle_data_disk }}"
        ;;
      *)
        echo "Unsupported filesystem type: $fstype" >&2; exit 1
        ;;
    esac
    udevadm trigger --action=change "$dev"
    udevadm settle
  register: data_disk_setup
  changed_when: "'already_labelled' not in data_disk_setup.stdout"
  when: _oracle_data_disk_ok

- name: Ensure ORAFRA label is set on FRA disk
  ansible.builtin.shell: |
    set -e
    if blkid -L ORAFRA > /dev/null 2>&1; then
      echo "already_labelled"
      exit 0
    fi
    dev="{{ oracle_fra_disk }}1"
    [ -b "$dev" ] || dev="{{ oracle_fra_disk }}"
    fstype=$(blkid -o value -s TYPE "$dev" 2>/dev/null || true)
    case "$fstype" in
      xfs)
        xfs_admin -L ORAFRA "$dev"
        ;;
      ext2|ext3|ext4)
        e2label "$dev" ORAFRA
        ;;
      "")
        wipefs -a "{{ oracle_fra_disk }}"
        mkfs.xfs -L ORAFRA -f "{{ oracle_fra_disk }}"
        ;;
      *)
        echo "Unsupported filesystem type: $fstype" >&2; exit 1
        ;;
    esac
    udevadm trigger --action=change "$dev"
    udevadm settle
  register: fra_disk_setup
  changed_when: "'already_labelled' not in fra_disk_setup.stdout"
  when: _oracle_fra_disk_ok

- name: Create mount point directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  loop:
    - "{{ oracle_data_dir }}"
    - "{{ oracle_fra_dir }}"

- name: Mount Oracle data disk persistently
  ansible.posix.mount:
    path: "{{ oracle_data_dir }}"
    src: "LABEL=ORADATA"
    fstype: auto
    opts: defaults,noatime
    state: mounted
  when: _oracle_data_disk_ok

- name: Mount tmpfs at oracle_data_dir (disk device too small)
  ansible.posix.mount:
    path: "{{ oracle_data_dir }}"
    src: tmpfs
    fstype: tmpfs
    opts: "size={{ oracle_tmpfs_size | default('20g') }},mode=0755"
    state: mounted
  when: not _oracle_data_disk_ok

- name: Mount FRA disk persistently
  ansible.posix.mount:
    path: "{{ oracle_fra_dir }}"
    src: "LABEL=ORAFRA"
    fstype: auto
    opts: defaults,noatime
    state: mounted
  when: _oracle_fra_disk_ok

- name: Mount tmpfs at oracle_fra_dir (disk device too small)
  ansible.posix.mount:
    path: "{{ oracle_fra_dir }}"
    src: tmpfs
    fstype: tmpfs
    opts: "size={{ oracle_tmpfs_size | default('20g') }},mode=0755"
    state: mounted
  when: not _oracle_fra_disk_ok

# ---------------------------------------------------------------------------
# Stage 2 – filesystem free-space check
# Overlay a tmpfs when the mounted filesystem has < 5 GiB free, regardless
# of whether Stage 1 used a real disk or a tmpfs (idempotent via /proc/mounts).
# ---------------------------------------------------------------------------
- name: Check free space on oracle_data_dir
  ansible.builtin.shell: |
    df -B1 "{{ oracle_data_dir }}" | awk 'NR==2{print $4}'
  register: _data_dir_avail
  changed_when: false

- name: Check free space on oracle_fra_dir
  ansible.builtin.shell: |
    df -B1 "{{ oracle_fra_dir }}" | awk 'NR==2{print $4}'
  register: _fra_dir_avail
  changed_when: false

- name: Check whether oracle_data_dir is already a tmpfs overlay
  ansible.builtin.shell: |
    grep -q "^tmpfs {{ oracle_data_dir }} tmpfs" /proc/mounts && echo yes || echo no
  register: _data_tmpfs_active
  changed_when: false

- name: Check whether oracle_fra_dir is already a tmpfs overlay
  ansible.builtin.shell: |
    grep -q "^tmpfs {{ oracle_fra_dir }} tmpfs" /proc/mounts && echo yes || echo no
  register: _fra_tmpfs_active
  changed_when: false

- name: Overlay tmpfs on oracle_data_dir (filesystem has insufficient free space)
  ansible.builtin.command: >-
    mount -t tmpfs
    -o size={{ oracle_tmpfs_size | default('20g') }},mode=0755
    tmpfs {{ oracle_data_dir }}
  when:
    - (_data_dir_avail.stdout | trim | int) < 5368709120
    - _data_tmpfs_active.stdout == "no"
  changed_when: true

- name: Overlay tmpfs on oracle_fra_dir (filesystem has insufficient free space)
  ansible.builtin.command: >-
    mount -t tmpfs
    -o size={{ oracle_tmpfs_size | default('20g') }},mode=0755
    tmpfs {{ oracle_fra_dir }}
  when:
    - (_fra_dir_avail.stdout | trim | int) < 5368709120
    - _fra_tmpfs_active.stdout == "no"
  changed_when: true

- name: Set ownership of mount points after mounting
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
    recurse: false
  loop:
    - "{{ oracle_data_dir }}"
    - "{{ oracle_fra_dir }}"
