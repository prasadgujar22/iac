---
# =============================================================================
# Prepare dedicated disks for Oracle datafiles and FRA
# scsi1 (/dev/sdb) → /u01/oradata
# scsi2 (/dev/sdc) → /u01/fra
# =============================================================================

- name: Check if Oracle data disk already has a filesystem
  ansible.builtin.command: blkid {{ oracle_data_disk }}
  register: data_blkid
  changed_when: false
  failed_when: false

- name: Create ext4 filesystem on Oracle data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ oracle_data_disk }}"
    opts: -L ORADATA
  when: data_blkid.rc != 0

- name: Check if FRA disk already has a filesystem
  ansible.builtin.command: blkid {{ oracle_fra_disk }}
  register: fra_blkid
  changed_when: false
  failed_when: false

- name: Create ext4 filesystem on FRA disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ oracle_fra_disk }}"
    opts: -L ORAFRA
  when: fra_blkid.rc != 0

- name: Ensure ORADATA label is set on data disk
  ansible.builtin.command: e2label {{ oracle_data_disk }} ORADATA
  changed_when: false

- name: Ensure ORAFRA label is set on FRA disk
  ansible.builtin.command: e2label {{ oracle_fra_disk }} ORAFRA
  changed_when: false

- name: Create mount point directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  loop:
    - "{{ oracle_data_dir }}"
    - "{{ oracle_fra_dir }}"

- name: Mount Oracle data disk persistently
  ansible.posix.mount:
    path: "{{ oracle_data_dir }}"
    src: "LABEL=ORADATA"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Mount FRA disk persistently
  ansible.posix.mount:
    path: "{{ oracle_fra_dir }}"
    src: "LABEL=ORAFRA"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Set ownership of mount points after mounting
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
    recurse: false
  loop:
    - "{{ oracle_data_dir }}"
    - "{{ oracle_fra_dir }}"
