---
# =============================================================================
# roles/common/tasks/main.yml
# OS prerequisites common to all VMs (Nginx, WLS nodes, DB server)
# =============================================================================

- name: Update all packages to latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  tags: [common_packages]

- name: Install common utility packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
  tags: [common_packages]

- name: Enable and start chronyd (NTP)
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
  tags: [common_ntp]

- name: Configure NTP servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chronyd
  tags: [common_ntp]

- name: Set system timezone to UTC
  community.general.timezone:
    name: UTC
  tags: [common_timezone]

- name: Disable SELinux (set to permissive for Oracle compatibility)
  ansible.posix.selinux:
    policy: targeted
    state: permissive
  tags: [common_selinux]

- name: Ensure SELinux is permissive at boot (selinux config file)
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line:  'SELINUX=permissive'
  tags: [common_selinux]

- name: Disable transparent huge pages (Oracle requirement)
  ansible.builtin.copy:
    dest: /etc/systemd/system/disable-thp.service
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled && echo never > /sys/kernel/mm/transparent_hugepage/defrag'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd
  tags: [common_thp]

- name: Enable and start disable-thp service
  ansible.builtin.systemd:
    name: disable-thp
    state: started
    enabled: true
    daemon_reload: true
  tags: [common_thp]

- name: Set swappiness to 10 (Oracle recommendation)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    sysctl_set: true
    reload: true
  tags: [common_sysctl]

- name: Populate /etc/hosts with all cluster members
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED – cluster hosts"
    block: |
      192.168.29.130  nginx-server
      192.168.29.131  wls-admin
      192.168.29.132  wls-node1
      192.168.29.133  wls-node2
      192.168.29.134  oracle-db
  tags: [common_hosts]
