---
# =============================================================================
# Distribute domain to Managed Server nodes and start Managed Servers
# =============================================================================

- name: Deploy pack/unpack script
  ansible.builtin.template:
    src: unpack_domain.sh.j2
    dest: "{{ installer_stage }}/unpack_domain.sh"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Pack domain on Admin Server (delegate)
  ansible.builtin.command: >
    {{ mw_home }}/oracle_common/common/bin/pack.sh
    -domain={{ domain_home }}
    -template={{ installer_stage }}/{{ domain_name }}_template.jar
    -template_name="{{ domain_name }}"
    -managed=true
  delegate_to: "{{ groups['wls_admin'][0] }}"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ jdk_home }}"
    MW_HOME:   "{{ mw_home }}"
  run_once: true
  register: pack_result
  changed_when: pack_result.rc == 0

- name: Fetch packed domain template to control node
  ansible.builtin.fetch:
    src: "{{ installer_stage }}/{{ domain_name }}_template.jar"
    dest: "/tmp/{{ domain_name }}_template.jar"
    flat: true
  delegate_to: "{{ groups['wls_admin'][0] }}"
  run_once: true

- name: Copy domain template to managed nodes
  ansible.builtin.copy:
    src: "/tmp/{{ domain_name }}_template.jar"
    dest: "{{ installer_stage }}/{{ domain_name }}_template.jar"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"

- name: Unpack domain on managed node
  ansible.builtin.command: >
    {{ mw_home }}/oracle_common/common/bin/unpack.sh
    -domain={{ domain_home }}
    -template={{ installer_stage }}/{{ domain_name }}_template.jar
    -user_name={{ wls_admin_user }}
    -password={{ wls_admin_password }}
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ jdk_home }}"
    MW_HOME:   "{{ mw_home }}"
  register: unpack_result
  failed_when:
    - unpack_result.rc != 0
    - '"unpack.sh completed" not in unpack_result.stdout'
  changed_when: '"unpack.sh completed" in unpack_result.stdout'

- name: Deploy Managed Server startup script
  ansible.builtin.template:
    src: start_managed_server.sh.j2
    dest: "{{ domain_home }}/bin/startManagedServer_{{ inventory_hostname_short }}.sh"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Start Managed Server
  ansible.builtin.shell: |
    nohup {{ domain_home }}/bin/startManagedServer_{{ inventory_hostname_short }}.sh \
      > {{ domain_home }}/logs/{{ inventory_hostname_short }}.log 2>&1 &
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME:    "{{ jdk_home }}"
    MW_HOME:      "{{ mw_home }}"
    DOMAIN_HOME:  "{{ domain_home }}"
    ADMIN_URL:    "{{ admin_server_url }}"
  changed_when: true

- name: Wait for Managed Server to start on port {{ managed_server_port }}
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ managed_server_port }}"
    delay: 15
    timeout: 300
    state: started

- name: Deploy Managed Server systemd service
  ansible.builtin.template:
    src: wls-managed.service.j2
    dest: /etc/systemd/system/wls-managed-{{ inventory_hostname_short }}.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable Managed Server service
  ansible.builtin.systemd:
    name: "wls-managed-{{ inventory_hostname_short }}"
    enabled: true
    daemon_reload: true
