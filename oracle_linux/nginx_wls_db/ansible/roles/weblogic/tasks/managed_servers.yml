---
# =============================================================================
# Distribute domain to Managed Server nodes and start Managed Servers
# =============================================================================

- name: Check if domain template already exists on managed node
  ansible.builtin.stat:
    path: "{{ installer_stage }}/{{ domain_name }}_template.jar"
  register: template_exists

- name: Pack domain on Admin Server (delegate)
  ansible.builtin.command: >
    {{ mw_home }}/oracle_common/common/bin/pack.sh
    -domain={{ domain_home }}
    -template={{ installer_stage }}/{{ domain_name }}_template.jar
    -template_name="{{ domain_name }}"
    -managed=true
  delegate_to: "{{ groups['wls_admin'][0] }}"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ jdk_home }}"
    MW_HOME:   "{{ mw_home }}"
  run_once: true
  register: pack_result
  changed_when: pack_result.rc == 0
  when: not template_exists.stat.exists

- name: Fetch packed domain template to control node
  ansible.builtin.fetch:
    src: "{{ installer_stage }}/{{ domain_name }}_template.jar"
    dest: "/tmp/{{ domain_name }}_template.jar"
    flat: true
  delegate_to: "{{ groups['wls_admin'][0] }}"
  run_once: true
  when: not template_exists.stat.exists

- name: Copy domain template to managed nodes
  ansible.builtin.copy:
    src: "/tmp/{{ domain_name }}_template.jar"
    dest: "{{ installer_stage }}/{{ domain_name }}_template.jar"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when: not template_exists.stat.exists

- name: Check if domain already unpacked on managed node
  ansible.builtin.stat:
    path: "{{ domain_home }}/config/config.xml"
  register: managed_domain_exists

- name: Unpack domain on managed node
  ansible.builtin.command: >
    {{ mw_home }}/oracle_common/common/bin/unpack.sh
    -domain={{ domain_home }}
    -template={{ installer_stage }}/{{ domain_name }}_template.jar
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ jdk_home }}"
    MW_HOME:   "{{ mw_home }}"
  register: unpack_result
  failed_when: >
    unpack_result.rc != 0
    or "succeed: write Domain" not in (unpack_result.stdout | default(''))
  changed_when: '"succeed: write Domain" in unpack_result.stdout'
  when: not managed_domain_exists.stat.exists

- name: Deploy Managed Server startup script
  ansible.builtin.template:
    src: start_managed_server.sh.j2
    dest: "{{ domain_home }}/bin/startManagedServer_{{ wls_server_name }}.sh"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Check if Managed Server is already listening on port {{ managed_server_port }}
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ managed_server_port }}"
    timeout: 5
    state: started
  register: ms_already_up
  ignore_errors: true
  changed_when: false

- name: Start Managed Server
  ansible.builtin.shell: |
    nohup {{ domain_home }}/bin/startManagedServer_{{ wls_server_name }}.sh \
      > {{ domain_home }}/logs/{{ wls_server_name }}.log 2>&1 &
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME:    "{{ jdk_home }}"
    MW_HOME:      "{{ mw_home }}"
    DOMAIN_HOME:  "{{ domain_home }}"
    ADMIN_URL:    "{{ admin_server_url }}"
  changed_when: true
  when: ms_already_up is failed

- name: Wait for Managed Server to start on port {{ managed_server_port }}
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ managed_server_port }}"
    delay: 15
    timeout: 300
    state: started
  when: ms_already_up is failed

- name: Deploy Managed Server systemd service
  ansible.builtin.template:
    src: wls-managed.service.j2
    dest: /etc/systemd/system/wls-managed-{{ wls_server_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable Managed Server service
  ansible.builtin.systemd:
    name: "wls-managed-{{ wls_server_name }}"
    enabled: true
    daemon_reload: true
