---
# =============================================================================
# Create WLS domain on the Admin Server
# =============================================================================

- name: Deploy domain creation WLST script
  ansible.builtin.template:
    src: create_domain.py.j2
    dest: "{{ installer_stage }}/create_domain.py"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Check if domain already exists
  ansible.builtin.stat:
    path: "{{ domain_home }}/config/config.xml"
  register: domain_exists

- name: Remove partial domain directory (cleanup after failed prior run)
  ansible.builtin.file:
    path: "{{ domain_home }}"
    state: absent
  when: not domain_exists.stat.exists

- name: Create WebLogic domain via WLST
  ansible.builtin.command: >
    {{ mw_home }}/oracle_common/common/bin/wlst.sh
    {{ installer_stage }}/create_domain.py
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ jdk_home }}"
    MW_HOME:   "{{ mw_home }}"
    PATH:      "{{ jdk_home }}/bin:{{ mw_home }}/oracle_common/common/bin:{{ ansible_env.PATH }}"
  register: domain_create_result
  failed_when: >
    domain_create_result.rc != 0
    or "Domain created successfully" not in domain_create_result.stdout
  changed_when: '"Domain created successfully" in domain_create_result.stdout'
  when: not domain_exists.stat.exists

- name: Create domain logs directory
  ansible.builtin.file:
    path: "{{ domain_home }}/logs"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"

- name: Deploy JDBC datasource descriptor
  ansible.builtin.template:
    src: jdbc_datasource.xml.j2
    dest: "{{ domain_home }}/config/jdbc/{{ wls_ds_name }}-jdbc.xml"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
  when:
    - not domain_exists.stat.exists
    - wls_ds_name is defined

- name: Create AdminServer security directory for boot.properties
  ansible.builtin.file:
    path: "{{ domain_home }}/servers/AdminServer/security"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Deploy boot.properties (allows Production Mode unattended startup)
  ansible.builtin.copy:
    dest: "{{ domain_home }}/servers/AdminServer/security/boot.properties"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0600"
    content: |
      username={{ wls_admin_user }}
      password={{ wls_admin_password }}

- name: Start WebLogic Admin Server
  ansible.builtin.shell: |
    nohup {{ domain_home }}/bin/startWebLogic.sh \
      > {{ domain_home }}/logs/admin_server.log 2>&1 &
    echo $!
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ jdk_home }}"
    MW_HOME:   "{{ mw_home }}"
    DOMAIN_HOME: "{{ domain_home }}"
  register: admin_start
  changed_when: true

- name: Wait for Admin Server to accept connections on port {{ admin_server_port }}
  ansible.builtin.wait_for:
    host: "{{ admin_server_host }}"
    port: "{{ admin_server_port }}"
    delay: 15
    timeout: 600
    state: started
  register: admin_wait
  ignore_errors: true

- name: Show Admin Server log tail on startup failure
  ansible.builtin.command: >
    tail -100 {{ domain_home }}/logs/admin_server.log
  register: admin_log_tail
  changed_when: false
  when: admin_wait is failed

- name: Print Admin Server log on startup failure
  ansible.builtin.debug:
    var: admin_log_tail.stdout_lines
  when: admin_wait is failed

- name: Fail if Admin Server did not start
  ansible.builtin.fail:
    msg: "Admin Server did not start within 600 seconds. Check log output above."
  when: admin_wait is failed

- name: Deploy Admin Server systemd service
  ansible.builtin.template:
    src: wls-admin.service.j2
    dest: /etc/systemd/system/wls-admin.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable Admin Server service
  ansible.builtin.systemd:
    name: wls-admin
    enabled: true
    daemon_reload: true
