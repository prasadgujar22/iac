# AlmaLinux 9.x Kickstart for Proxmox Template
# ------------------------------------------

# Use local CD-ROM/DVD as the installation source
cdrom

# Use text-based installer for speed and compatibility
text

# Keyboard and Language settings (FIXED SYNTAX)
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8

# Network configuration
network --bootproto=dhcp --device=link --activate --onboot=on

# Root password
rootpw --plaintext packer

# Create a 'packer' user for SSH provisioning
user --name=packer --groups=wheel --plaintext --password=packer

# System Services
selinux --enforcing
firewall --enabled --service=ssh
timezone UTC --utc

# --- DISK PARTITIONING ---
# Ensures the disk is wiped and partitioned automatically
zerombr
clearpart --all --initlabel
autopart --type=lvm

# Agree to the EULA and disable first-boot setup
firstboot --disable
eula --agreed

# Reboot automatically after installation
reboot

# Post-installation script
%post --log=/var/log/anaconda/post-install.log
echo "packer ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/packer
chmod 440 /etc/sudoers.d/packer
dnf install -y qemu-guest-agent
systemctl enable qemu-guest-agent
# Disable IPv6 so the qemu-guest-agent reports only the IPv4 address.
# Without this, Packer may pick the global IPv6 address for SSH and hang.
grubby --update-kernel=ALL --args="ipv6.disable=1"
truncate -s 0 /etc/machine-id
%end

# Package selection
%packages
@^minimal-environment
kexec-tools
qemu-guest-agent
-iwl*
-ipw*
%end
